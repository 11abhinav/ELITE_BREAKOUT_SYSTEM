# ELITE BREAKOUT SYSTEM: V8 ARCHITECTURE (SINGLE SOURCE OF TRUTH)
*(Last Updated: 2026-07-21 | System Version: V8.0 / Target Engine v7.1)*

## 1. System Overview & Execution Flow

The Elite Breakout System is a highly concurrent, fully automated trading scanner optimized for the Indian Equity Market (NSE/BSE). It is designed to run continuously on cloud environments (Railway), orchestrating 5 primary algorithmic pipelines through a unified SQLite database and exposing a decoupled Web Dashboard.

### 1.1 Architecture Mermaid Diagram
```mermaid
flowchart TD
    subgraph Schedulers [Orchestration Layer - main.py]
        A1[Multi-TF Watchdog]
        A2[EOD Scheduler]
        A3[Reversal Scheduler]
        A4[Wealth Engine Scheduler]
    end

    subgraph Core [Data & Caching Layer]
        B1[Data Provider Factory]
        B2[Price Cache .parquet]
        B3[Validation Engine V8]
    end

    subgraph Scanners [Algorithm Layer]
        C1[multi_tf_scanner.py]
        C2[eod_scanner.py]
        C3[reversal_scanner.py]
        C4[wealth_engine.py]
        C5[multibagger_pipeline.py]
    end

    subgraph Risk [Execution & Risk Layer]
        D1[sl_target_helper.py]
        D2[breakout_engine.py]
        D3[performance_tracker.py]
    end

    subgraph Persistence [Database Layer]
        E1[(alerts.db SQLite)]
    end

    subgraph Web [Presentation Layer]
        F1[dashboard_server.py Flask]
    end

    Schedulers -->|Triggers| Scanners
    Scanners -->|Fetches Data| Core
    Core -->|Validates API Data| Scanners
    Scanners -->|Applies Logic| Risk
    Risk -->|Persists Signals| Persistence
    Persistence -->|Serves UI| Web
```

### 1.2 Startup Sequence (`main.py`)
1. **Boot Checks**: Invokes `diagnostics.py` to assert memory limits, filesystem writable paths, and `schedule` package versions.
2. **Database Cleanups**: Invokes `_cleanup_old_scanner_names()` to strip dead thread records from `scanner_health` ensuring a clean state.
3. **Daemon Subprocesses**: Spawns multiple `threading.Thread` instances wrapped in a `restartable_thread_wrapper`:
   - `run_dashboard()`: Binds the Flask server to port 5000.
   - `performance_tracker`: Constantly updates historical alert hit/miss states.
   - `ai_worker_daemon`: Parses earnings transcripts asynchronously.
   - `live_scanner_thread`: Controls Intraday (Multi-TF).
4. **Cron Scheduler**: Blocks the main thread with `schedule.run_pending()` to fire off EOD, Reversal, and Wealth Engine at 21:00 IST daily.
5. **Fault Recovery**: If any background thread crashes, the `restartable_thread_wrapper` sleeps for 60 seconds and respawns it indefinitely, guaranteeing high availability.

## 2. Folder Structure & Module Responsibilities

The codebase separates infrastructure, data ingestion, core engines, and specific scanners.

### 2.1 Root Application (`app/`)
* **`main.py`**: The orchestrator, scheduler, and fault-recovery loop.
* **`config.py`**: The centralized truth for all weights, scoring caps, and algorithm parameters.
* **`database.py`**: Connection pool and SQLite schema manager for `alerts.db`.
* **`dashboard_server.py`**: Flask frontend.

### 2.2 Scanners (The Pipeline Implementations)
* **`eod_scanner.py`**: Daily momentum breakouts (Runs at 21:00 IST).
* **`reversal_scanner.py`**: Fallen angels / oversold structurally sound stocks.
* **`multi_tf_scanner.py`**: Intraday precision entries using 1H/30m/15m/5m timeframes.
* **`wealth_engine.py`**: Medium-term momentum on structurally sound companies crossing 200DMA.
* **`multibagger.py`**: Deep-fundamental hold screening using the `app/core/` pipelines.

### 2.3 Data & Caching (`app/data_providers/` & Core)
* **`data_provider.py`**: Routes API calls between Fyers and YFinance. Handles BSE mapping (`BSE_FALLBACK_MAPPING`).
* **`price_cache.py`**: Delta-fetching cache stored in `.parquet` files. Checks first date to prevent infinite historical looping on IPOs.
* **`fundamentals_cache.py`**: Disk-backed cache for financial metrics (ROE, ROCE, Debt/Equity).
* **`data_quality.py`**: Detects anomalies like `MAX_HISTORY_SHRINK` to block corrupted data.

### 2.4 Modular Validation (`app/validation/`)
* **`engine.py`**: The V8 Validation Engine that enforces strict dataset contracts before any scanner touches the data.
* **`validators/`**: Dataset-specific rules (e.g., `bhavcopy_validator.py`, `price_validator.py`).
* **`scoring/`**: Quality computation (e.g., deducting points for missing wicks, penalizing stale data).

### 2.5 Core Evaluation Engines (`app/core/`)
* **`multibagger_pipeline.py`**: Orchestrates sequential checks for long-term investments.
* **`gate_engine.py`**: Hard fundamental filters (Debt, Pledges).
* **`financial_strength_engine.py`**: Piotroski scores and ROE/ROCE gating.
* **`valuation_engine.py`**: Graham Intrinsic Value and Discounted Cash Flows.
* **`audit_engine.py`**: State persistence for point-in-time scoring audibility.

### 2.6 Execution, Risk & Helpers
* **`breakout_engine.py`**: Identifies specific candle setups (Gap-ups, Volume Climax, Tight Bases).
* **`sl_target_helper.py`**: Institutional Support/Resistance cluster detection. Calculates Target 1, 2, 3 and Structural Stop Loss.
* **`scoring_engine.py`**: Composite technical momentum scoring.
* **`memory_profiler.py`**: Production telemetry tracking dataframe `id()` and RSS Delta / Rows metrics.

## 3. Data Ingestion, Validation & Caching (V8 Framework)

Data integrity is the foundation of the Elite Breakout System. The ingestion pipeline guarantees that corrupted or partial data from upstream providers (Fyers/YFinance) is rejected before any algorithmic evaluation occurs.

### 3.1 Data Flow Diagram
```mermaid
flowchart TD
    API[External API - Fyers/NSE] --> Fetcher[data_provider.py]
    Fetcher --> Fallback{Is .NS missing?}
    Fallback -- Yes --> BSE[BSE_FALLBACK_MAPPING]
    Fallback -- No --> Cache[price_cache.py]
    BSE --> Cache
    Cache --> Engine[Validation Engine V8]
    Engine --> Validator[price_validator.py]
    Validator --> Rules{Passes Contracts?}
    Rules -- Yes --> Scanners[Algorithmic Scanners]
    Rules -- No --> Quarantine[Quarantine / Log]
    Rules -- Missing Days --> Delta[Trigger Delta Fetch]
```

### 3.2 V8 Validation Engine (`app/validation/engine.py`)
- **Strict Contracts**: All data is subjected to strict schema verification (`SCH001`). If a mandatory column (e.g., `SYMBOL`) is missing, the dataframe is destroyed immediately.
- **Data Quality Score**: `price_validator.py` calculates a dynamic score based on `QUALITY_SCORE_WEIGHTS`:
  - 40% Row Completeness.
  - 20% Missing Values (NaN wicks).
  - 20% Price Sanity (`High >= Low`).
  - 10% Continuity.
  - 10% Freshness.
- **Cache Protection**: If an incoming dataframe drops more than `MAX_HISTORY_SHRINK` (30%) of historical rows compared to the existing cache, the system invokes cache protection (`HIS001`). It drops the new API fetch, serves the cached `.parquet` data, and flags an administrative warning.

### 3.3 Price Cache (`price_cache.py`)
- **Delta-Fetching mechanism**: To minimize API hits, the system fetches only the exact number of days missing from the local `.parquet` file.
- **IPO Infinite Loop Fix**: If the earliest timestamp in the API matches the earliest timestamp in the cache, the system identifies the stock as an IPO. It flags the first date locally and avoids executing useless full historical fetches.

## 4. The Algorithmic Scanners

The system employs multiple concurrent scanners targeting different institutional market patterns.

### 4.1 EOD Scanner (`eod_scanner.py`)
- **Focus**: High-probability end-of-day momentum breakouts.
- **Execution**: Daily at 21:00 IST (utilizes Bhavcopy fallback if delayed).
- **Core Filters**: 
  - `MIN_DAILY_LIQUIDITY_RUPEES_WATCHLIST` ensures only highly liquid stocks are processed.
  - `EOD_ADVANCED_CONFIG`: Rejects gap-and-go traps (>15% single-day move), checks distance from 52W high (<15%), and requires tight bases.
- **Confirmation**: Relies on `breakout_engine.detect_breakouts()` to enforce that volume on the breakout day exceeds `MIN_BREAKOUT_VOLUME_RATIO` (1.5x of 20-period average).

### 4.2 Reversal Scanner (`reversal_scanner.py`)
- **Focus**: Fundamentally strong stocks currently undergoing an oversold reversion.
- **Execution**: Daily at 21:00 IST.
- **Core Filters**:
  - Requires a 20% to 45% drop from the 52-week high (`MIN_DROP_FROM_52W_HIGH`).
  - `passes_profitability_gate()` ensures the stock isn't structurally doomed (Requires ROE/ROCE >= 15%).
  - RSI must be curling upwards out of oversold territory (Current RSI > `RSI_OVERSOLD_THRESHOLD`).
  - MACD Histogram is normalized (`(macd_hist / close) * 100`) to confirm positive momentum divergence regardless of absolute stock price.
- **Fallen-Knife Defense**: A strict 30-day `REVERSAL_COOLDOWN_TRADING_DAYS` is applied to any stock that generated a reversal signal to avoid spamming alerts on continuous downtrends.

### 4.3 Multi-TF Intraday Scanner (`multi_tf_scanner.py`)
- **Focus**: Precision entries by aligning 1-Hour, 30-Min, 15-Min, and 5-Min trend architectures.
- **Execution**: Continuous background daemon loop every 5 minutes during market hours.
- **Phase A (Hourly Filter)**: Ensures MACD is positive, ADX > 25 (strong trend), and Price > VWAP.
- **Phase B & C**: Verifies 30m and 15m structure, specifically looking for Bollinger Band squeezing or RSI coiling.
- **Phase D (5-Min Trigger)**: Configurable via `PULLBACK_TRIGGER_MODE`. 
  - Standard trigger: `close > previous_high`.
  - Also configurable to `PREVIOUS_OPEN`, `INSIDE_BAR`, or `ENGULFING` depending on market regime.

### 4.4 Wealth Engine & Multibagger Pipeline
- **Focus**: Long-term structural holds and deep valuation discounts.
- **Execution**: Scheduled asynchronously via `main.py` cron jobs.
- **Workflow**: 
  - Routes through the core pipeline (`gate_engine` -> `financial_strength_engine` -> `valuation_engine`).
  - `bayesian_updater.py` applies macro-market probability weights to fundamental scores.
  - If a company passes the `TARGET_CONFIDENCE_BASELINE` (85+), it is persisted into `alerts.db` strictly under the `WEALTH` or `MULTIBAGGER` scanner tags.

## 5. Core Valuation & Scoring Engines (`app/core/`)

The fundamental valuation framework is completely modularized. It operates on a pipeline pattern where `SnapshotCollector` and `AuditEngine` wrap the inputs to guarantee deterministic replayability and auditing.

### 5.1 Pipeline Stages
1. **Gate Engine (`gate_engine.py`)**: Filters out fundamentally toxic structures (e.g., Debt to Equity > 2.0). 
2. **Financial Engine (`financial_strength_engine.py`)**: Calculates Piotroski F-Scores. Identifies whether the stock is Financial (uses ROE) or Non-Financial (uses ROCE).
3. **Valuation Engine (`valuation_engine.py`)**: Computes Graham Number and Margin of Safety.
4. **Growth Engine (`growth_engine.py`)**: Analyzes YoY historical revenue and profit margins.

### 5.2 Mathematical Invariants (`invariant_engine.py`)
To prevent infinite loops or scoring hallucinations, the system relies on strict invariants:
- `MAX_SCORE_CAP`: A stock can never exceed a composite score of 100.
- `MARGIN_OF_SAFETY_CAP`: MoS is strictly bounded; negative values trigger pipeline rejection rather than returning illogical integers.
- `REJECT_STATE_LOCK`: Once an engine returns `Status = REJECTED`, no downstream engine is permitted to override it to `BUY`.

## 6. Target, SL & Risk Management Engine

Institutional algorithms wick-hunt standard retail stop losses. The Elite Breakout System anchors risk dynamically using structural support clusters rather than arbitrary percentages.

### 6.1 Structural Support Discovery (`sl_target_helper.py`)
- **Support Cluster Mechanics**: The engine analyzes the last 20 periods. If it identifies 2 or more pivot swing lows within `TARGET_CLUSTER_WINDOW_PCT` (0.75%) of each other, it assigns a `Swing Low Cluster` weight (40 pts) and places the Stop Loss immediately below that cluster.
- **Fallback Supports**: If no tight cluster is found, it traverses a hierarchy: Pivot S1 -> 50 DMA -> VWAP -> Intraday Low.
- **ADX Penalty Buffer**: If ADX indicates an extremely volatile trending market (ADX > 35), the Stop Loss buffer is widened algorithmically to avoid being shaken out during natural retracements.

### 6.2 Structural Resistance & Exit Profiling
- Targets (T1, T2, T3) are strictly mapped to overhead structural resistances (Swing Highs, R1, R2, Bollinger Bands, Fibonacci Extensions).
- **Target Confidence Scoring**: Every target is scored against `TARGET_SOURCE_WEIGHTS`. If a target is mapped to a minor timeframe high, it receives a lower confidence score than a major 52W high.
- **Exit Profiles**:
  - `AGGRESSIVE` (Multi-TF): T1=20%, T2=30%, T3=50% (Rides runners).
  - `BALANCED` (EOD): T1=40%, T2=30%, T3=30%.
  - `CONSERVATIVE` (Reversal): T1=30%, T2=30%, T3=40%.

## 7. Persistence, Telemetry & Observability

### 7.1 The Database Schema (`database.py`)
- **`alerts` table**: The primary output payload. Utilizes a strict unique index `alerts_dedup_idx (symbol, breakout_type, scanner, alert_date)` to prevent pipeline duplicates.
- **`scanner_health` table**: Driven by `main.py` watchdog. Reports UP/DOWN, execution time, and error traces directly to the Web UI.
- **`validation_history`**: Permanent ledger of every dataset rejection and schema failure.

### 7.2 Memory Profiling (`memory_profiler.py`)
- Every high-frequency operation (especially in `Multi-TF`) is wrapped in `@profile_function`.
- The system captures:
  - `Peak RSS` vs `End RSS` to isolate exact Transient Memory Allocation.
  - `id(largest_df)` to verify if Pandas dataframes are being correctly reused or continuously reallocated.
  - `RSS Delta / Rows Processed` efficiency metrics.

### 7.3 Pipeline Summaries (Funnel Tracking)
- To eliminate "Black Box" debugging, every scanner maintains a `lower_funnel` dictionary mapping exact rejection causes (e.g., `REJECTED_BY_VOLUME`, `REJECTED_BY_RSI`, `REJECTED_BY_PREV_HIGH`).
- A `[PIPELINE SUMMARY]` block is printed to standard output at the completion of every run, which is ingested by the dashboard logger.

---

## 8. Centralized Configuration (`config.py`)

Every hyperparameter and heuristic threshold is strictly decoupled from algorithm logic and isolated in `config.py`.

### 8.1 Key Configuration Vectors
- `REGIME_POLICIES`: Controls scanner behavior dynamically based on the NIFTY macro environment. 
  - `STRONG_BEAR`: Breakouts = False, Max Positions = 0.
  - `WEAK_BULL`: Mean Reversion = True, Breakouts = True, Max Positions = 3.
- `ADAPTIVE_TARGET_CAPS`: Caps the maximum permissible Target 3 distance based on regime (`BULL` = 12%, `BEAR` = 8%).
- `ALERT_COOLDOWN_MINUTES`: EOD/Reversals use `5760` (96 hours) to prevent double-firing alerts over long holiday weekends when utilizing Bhavcopy fallback data.
- `MIN_NATURAL_RR`: The Minimum Risk-Reward acceptable by the Risk Engine. `MULTI_TF` = 1.5, `EOD` = 2.5, `REVERSAL` = 2.0. If `sl_target_helper.py` cannot mathematically align structural resistance with this RR, the alert is aborted.
