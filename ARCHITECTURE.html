## 33. Scanner Locking & Queue Architecture

To prevent rate-limit starvation and cross-thread data races, all primary execution pipelines are serialized using explicit threading or process locks.

### 33.1 The Global Execution Lock (`scanner_execution_lock`)
- **Shared Locking:** The system utilizes a global `threading.Lock` (`scanner_execution_lock` in `main.py`) which acts as a serialized gateway for EOD, Reversal, Multibagger, and all associated Admin Manual Triggers.
- **The `QUEUED` State:** Whenever a scanner is invoked (either via its background schedule or a manual admin trigger), it first updates its status in the database to `QUEUED` with an explicit message (`Waiting for global execution lock...`). 
- **Transition to `RUNNING`:** The scanner execution thread is then blocked from proceeding until the lock is freed. Only *after* the lock is successfully acquired will the database transition the state to `RUNNING`. This ensures the Admin Dashboard accurately reflects real-time lock-starvation without falsely implying a scanner is actively making API calls when it is actually blocked.

### 33.2 Independent Process Locks (`_scan_lock`)
- The **Multi-TF Scanner** and **AI Worker Daemon** operate using independent process/file-based locks (`ProcessLock` from `lock_utils.py` or internal module locks). 
- **Isolation:** Because these background loops run on heavily staggered and independent timelines (Multi-TF every 5 minutes, AI Worker continuously overnight), they do not share the primary `scanner_execution_lock`. This prevents a long-running Multi-TF loop from indefinitely halting the critical EOD end-of-day execution sweep.

## 34. NSE API Fetching, Rate Limiting & Admin Notifications

Because the National Stock Exchange (NSE) employs a strict Cloudflare Web Application Firewall (WAF) to prevent aggressive automated scraping, all API requests targeted at `nseindia.com` must adhere to rigorous fetching protocols.

### 34.1 The WAF Bypass Protocol
- **Impersonation:** Standard `requests.Session` connections are immediately blocked with HTTP 403. The system explicitly requires `curl_cffi` using the `impersonate="chrome110"` flag to successfully mimic a valid browser fingerprint.
- **Header Injection:** Valid `User-Agent` and `Referer: https://www.nseindia.com/` headers must be attached to the active `curl_cffi` session.
- **Cookie Establishment:** Before fetching JSON payloads, PDFs, or CSV data, the session must execute a dry-run `GET` request to the NSE root homepage (`https://www.nseindia.com/`) to establish valid Cloudflare bypass cookies.

### 34.2 Rate Limiting and Spaced Requests
- To prevent IP bans from Cloudflare rate limits, explicit `time.sleep(2.5)` buffers are injected between sequential NSE endpoint queries.
- For example, if the `block_deal_detector.py` fetches the historical block-deals CSV, it must sleep for 2.5 seconds before querying the snapshot bulk-deals CSV.

### 34.3 Hard-Failure Alerting
- **No Swallowed Errors:** If the retry loop is exhausted and the data remains un-fetchable, the fetcher will fire an explicit, high-priority **Telegram/Push notification** directly to the admin (e.g., `⚠️ NSE API ERROR: Bhavcopy fetch failed`). This ensures that the execution engine never degrades silently in the background without explicit admin awareness.

## 35. Institutional Business Logic Refinements (v1.0)

To resolve False Negatives without compromising institutional risk models, the execution engine was updated with three core algorithmic adjustments.

### 35.1 Tight Stop Acceptance & Analytics
- The Structural Stop logic in `sl_target_helper.py` no longer forcefully rejects stops tighter than the `MIN_STOP_PCT`. Instead, it accepts the strongest structural anchor and flags it as a `TIGHT_STRUCT_`.
- Analytics metadata (`is_tight_stop`, `tight_stop_pct`, `min_stop_pct`) is actively exposed in the returned dictionary and explicitly logged for future Bayesian assessment of ultra-tight stop performance.

### 35.2 Dynamic Gap-and-Go Penalty
- The EOD Scanner no longer hard-rejects breakouts that close excessively far above the prior high (extended breakouts).
- Instead, it assesses a dynamic score deduction within a `technical_penalties` framework: `penalty = min(GAP_AND_GO_MAX_PENALTY, (atr_extension - MAX_EXTENDED_BREAKOUT_ATR_MULT) * GAP_AND_GO_PENALTY_MULT)`.
- This ensures that exceptional setups with massive fundamental/volume tailwinds can still clear the final threshold, while strictly punishing sub-par "chasers".

### 35.3 Block Deal Bonus Baseline & Tracking
- The Wealth Engine strictly mandates a minimum baseline (`Base FM_Score >= 50`) before allocating the +15 point Institutional Block Deal bonus. This prevents failing companies from clearing buy-gates solely off a single large order flow event.
- For complete downstream transparency, the Wealth payload now retains `base_fm_score` and `inst_bonus_applied` alongside the final score. Additionally, the Risk Engine sets `position_capped = True` if tight volatility unexpectedly maxes out the allocation limit.

## 36. SL/Target Engine v7 (Institutional Restructuring)

### 36.1 7-Layer Pipeline Architecture
To solve the false-positive target clustering and eliminate non-market synthetic levels (e.g. weighted averages), the `sl_target_helper.py` was completely refactored into a strict 7-layer pipeline:
1. **Candidate Generator**: Lazy-evaluation of specific candidate targets (Resistance, Highs, Fibonacci 127/162/200, ABCD). Candidates are only generated if preconditions (like ADX > 30 and VWAP confirmation for FIB_200) are met.
2. **Target Scorer**: Assigns institutional confidence weights based on current market regime and pattern strength, completely decoupled from candidate price generation.
3. **Cluster Engine**: Groups candidates within a `0.5 ATR` or `0.75%` window and establishes a consensus price driven by structural priority (e.g., `EQUAL_HIGH > RESISTANCE > FIB`).
4. **Round Number Engine**: Scans clusters, and if a consensus price is within `0.5%` of a major tick level (e.g. 50, 100, 500, 1000), it artificially pulls the target to the round number and awards an `+8` confidence boost.
5. **Conflict Resolver**: Selects the optimal clusters based on scanner policy (`REGIME` for EOD, `CONFIDENCE` for Multi-TF, and `NEAREST` for Reversal).
6. **Strategy Selector**: Routes the resolved clusters into exit tiers (T1/T2/T3) based on scanner-specific playbooks (e.g., Trend Extension for Multi-TF vs. Mean Reversion for Reversals).
7. **Exit Policy**: Applies the final exit sizing weights (e.g., Aggressive: 20/30/50).

### 36.2 Proper ABCD Alternating Pivot Validation
The `ABCDDetector` no longer uses naive local rolling highs/lows. It iterates backwards through strictly alternating `SWING_LOW` and `SWING_HIGH` pivots provided by `technical_indicators.py`. A valid ABCD pattern requires the `BC_ratio` (retracement) to fall strictly between `38.2%` and `78.6%`. Only then is the `CD = AB` projection generated.

### 36.3 Post-Trade Analytics Transparency
The entire generated candidate pool (including all rejected targets, their generation source, cluster assignments, and final selection state) is passed to the Performance Tracker via the `sl_result` JSONB field. This creates a fully queryable post-trade diagnostic trail, allowing quantitative review of exactly why a specific target was chosen over another.

## 37. System-Wide Integration Audit & Edge-Case Resolutions (v7 Final)

Following the deployment of the V7 Engine, a full-stack integration audit was conducted to resolve critical logic gaps arising from system intersections (e.g. orchestration state, tracker state, and data staleness).

### 37.1 Market Holiday Duplication Protection
**The Problem**: The `main.py` scheduler paused execution natively on weekends, but not public holidays. During a holiday, `bhavcopy_downloader` failed to fetch data and fell back to the previous trading day's data. Since the daily EOD scanner had an `ALERT_COOLDOWN_MINUTES` of 390 minutes (6.5 hours), a Friday alert would re-trigger identically on a Monday holiday (72 hours later) because the data was technically valid under the 4-day long-weekend staleness rules.
**The Solution**: The `ALERT_COOLDOWN_MINUTES` for both `EOD` and `REVERSAL` was extended to `5760` minutes (96 hours) in `config.py`. This ensures that even if a public holiday forces the scanner to evaluate stale data, it cannot re-issue the exact same breakout alert within a 4-day window.

### 37.2 Structural Failure Early-Exit (Performance Tracker)
**The Problem**: The V7 engine introduced `structural_failure_stop` as a tight early-exit level for setups that cleanly fail (preventing them from bleeding down to the wider protective stop loss). However, this level was only being captured in the database, and never evaluated by the `performance_tracker.py` forward-tick state machine.
**The Solution**: Injected a `STRUCTURAL_FAIL` evaluation block into the tracker loop immediately following the primary intraday stop loss (`SL_HIT`) check. 
- **Wick vs Close Validation**: The tracker explicitly processes `structural_failure_stop` on a *closing basis* (`close_p <= structural_failure_stop`), honoring the engine's design that structural levels require a confirmed close to be invalidated.
- Conversely, the protective `stop_loss` remains a hard intraday stop evaluated against the tick's `Low`.

### 37.3 Parallel Dispatch Orchestration
To optimize wall-clock time, the orchestrator now executes `eod_scanner` and `reversal_scanner` as parallel thread dispatches immediately upon Bhavcopy readiness, rather than sequentially. Because the database engine uses SQLite WAL and explicit thread locks, the scanners can evaluate completely independent strategies concurrently without data races.

### 37.4 Orphaned Structural Target Pipeline (sl_target_helper.py)
**The Problem**: The V7 engine function `_compute_structural_failure_stop` was an orphaned function. It was defined but never actually invoked inside the core V7 execution pathways (`_compute_eod`, `_compute_reversal`, `_compute_multi_tf`). This meant that `structural_failure_stop` universally returned `None`, completely disabling the early-exit tracker feature.
**The Solution**: Explicitly invoked the function within all three pipeline engines, resolving the required trailing inputs (e.g., `eff_atr` and `supports`), and injected the resolved price into the final output dictionary.

### 37.5 Multi-TF Scanner Database Mapping Parity
**The Problem**: During the initial V7 integration, the `eod_scanner` and `reversal_scanner` were correctly updated to capture the newly introduced `structural_failure_stop` and `target_quality_score` fields for database insertion. However, the `multi_tf_scanner` was bypassed, meaning intraday setups permanently lost this data.
### 37.6 Orphaned Target Quality Pipeline
**The Problem**: Similar to the structural failure stop logic, the V7 engine's explainable target quality score (`_compute_target_quality`) was implemented but remained uncalled inside the core execution branches (`_compute_multi_tf`, `_compute_eod`, `_compute_reversal`). Consequently, the trade ranking engine was operating blindly, as all scanners yielded a null score for target quality.
**The Solution**: Appended the target quality computations to all three primary execution pathways inside `sl_target_helper.py`, passing the required trailing variables (RSI, ADX, MACD, Volume) and inserting the derived `tq_score` into the master output payloads.

### 37.7 Opportunity Manager Database Payload Gap
**The Problem**: The `multi_tf_scanner` operates on a delayed DB injection strategy via the `OpportunityManager`. While the scanner itself queued the new V7 DB fields (`structural_failure_stop` and `target_quality_score`) into memory, `opportunity_manager.py` was not extracting them during its iterative sweep over the memory-mapped candidates when invoking the DB layer (`save_alert_if_new`).
**The Solution**: Patched the `OpportunityManager` to dynamically pull and append both DB parameters into the final `save_alert_if_new` commit step for `FUNDED` status alerts.
### 37.8 Combined System Flow: Pledge Data Gap (Scoring Engine)
**The Problem**: The `pledge_worker.py` correctly fetches and caches promoter pledge percentages into the `promoter_pledge_cache` table. The `multibagger.py` and `gate_engine.py` correctly use this data to disqualify stocks with >50% pledge. Additionally, the `bayesian_updater.py` explicitly defines a `PLEDGE_PENALTY` in `DEFAULT_WEIGHTS` for scoring. However, the `scoring_engine.py` (which powers the EOD, Multi-TF, and Reversal scanners) never queries the pledge cache or applies this penalty. Consequently, heavily pledged stocks can still achieve a >82 breakout score.
**The Implication**: The Institutional footprint validation is partially blind to pledge risk in the technical scanners, completely bypassing the intended Bayesian penalty.

### 37.9 Algorithm Version Bump
**The Problem**: With the multiple patches applied during the V7 Final audit, historical trades generated by the original V7.0 logic were conceptually mixed with those generated under the patched engine.
**The Solution**: The `ACTIVE_ALGO_VERSION` in `config.py` was officially bumped to `SL_ENGINE_V7.1` to enforce strict lineage boundaries for all forward-generated alerts.

## 38. V8 Architecture Finalization & Reliability Upgrades (2026-07-19)

### 38.1 Delivery Data Anomaly Handling (V8DeliveryValidator)
- **Old Behavior**: The delivery data fetching blindly applied `.fillna(0.0)` for all missing delivery percentages. Furthermore, a strict 5% missing data threshold was applied globally, which frequently caused `TOO_MUCH_MISSING_DATA` validation failures because the NSE exchange intentionally leaves `DELIV_PER` blank for Trade-To-Trade (BE, BZ) and SME (SM) series.
- **New Behavior**: The `V8DeliveryValidator` replaces the previous logic with a highly robust 7-stage pipeline. The validator is now **Column-and-Series-Aware**. It enforces the strict `< 5%` missing threshold *only* on standard Equities (`EQ` series), while intentionally preserving legitimate `NaN` values for `BE/BZ/SM` segments to prevent false data rejection.

### 38.2 Institutional Deal Source Migration (WAF Bypass)
- **Old Behavior**: Block and Bulk deals were fetched via `www.nseindia.com/api` endpoints. These JSON APIs were heavily throttled and frequently blocked by Akamai WAF rules, leading to 130s+ timeout hangs, fallback failures, and the ingestion of historical/stale block deals instead of strictly daily snapshots.
- **New Behavior**: The Institutional Data module (`institutional_data.py`) has been fully migrated to fetch from the unmetered CSV mirrors at `nsearchives.nseindia.com`. The execution time has plummeted from ~134 seconds to under 2 seconds. The logic is strictly restricted to parsing yesterday's deals, stripping out historical noise and significantly improving the precision of the `inst_accumulation` category.

### 38.3 Multi-Threaded Cache Deadlock Fixes
- **Old Behavior**: The `delivery_data` cache lock (`_delivery_cache_lock`) used a standard `threading.Lock`. Because the `fetch_previous_day_delivery` function and the internal validators both attempted to acquire this lock in a nested/reentrant manner during the Daily Builder execution, the system occasionally hard-froze in a permanent deadlock.
- **New Behavior**: The lock was swapped to `threading.RLock()` to safely permit reentrant locking by the same background worker thread, entirely eliminating the freezing behavior.

### 38.4 Dashboard Queue State Self-Healing
- **Old Behavior**: When an Admin triggered a scanner (like `DAILY_BUILDER` or `EOD`) from the Dashboard, the Postgres table `scanner_health` recorded its status as `QUEUED-X`. If the backend Railway container restarted (or a new code deploy occurred), the background execution threads were killed by the OS, but the Database retained the `QUEUED-X` string permanently. This created "ghost queues" on the Dashboard.
- **New Behavior**: The backend boot routine (`_cleanup_old_scanner_names` in `main.py`) now intercepts and cleans up all stuck `QUEUED%` statuses on startup, resetting them to `IDLE`. The system now correctly self-heals after every deployment.

### 38.5 Ephemeral Surveillance Cache Persistence (ASM/GSM Leak Fix)
- **Old Behavior**: The `surveillance.py` module saved the fetched NSE ASM/GSM surveillance list exclusively to the local disk (`surveillance_blacklist.json`). On Railway (or any ephemeral container platform), this file was permanently wiped upon every code deployment or container restart. If the live NSE API subsequently blocked the fetch attempt (via Akamai rate-limiting), the system would fall back to an empty cache, completely failing to filter out toxic ASM/GSM stocks and erroneously leaking them into the watchlist.
- **New Behavior**: The surveillance caching mechanism has been fully wired into the PostgreSQL `system_state` table. Fetched lists are instantly committed to the database (`save_system_state`), and the fallback logic natively restores from the database (`get_system_state`) instead of the local ephemeral file system. The surveillance guard (261+ stocks) is now guaranteed to survive all server restarts and deployments.

## 40. V8 Data Quality & Validation Engine

### 40.1 System Invariant: Cache Protection
**Healthy cache can never be overwritten by lower-quality data.**
The V8 Data Quality Framework elevates data ingestion from a simple `df is not empty` check to a deterministic, lexicographical scoring pipeline. Incoming data is objectively evaluated and explicitly compared against the historical cache to protect the system from upstream provider anomalies (like Yahoo Finance BSE `.BO` truncations).

### 40.2 ValidationEngine Framework (Updated 2026-07-19)
~~All data ingested from `DataFetcher` subclasses must be validated by the `DataQualityValidator`, which computes an objective `QualityScore` (0-100)...~~
*(Removed 2026-07-19: The monolithic DataQualityValidator was deprecated in favor of the decoupled ValidationEngine)*

The new `ValidationEngine` explicitly orchestrates validation via a strict 4-stage lifecycle:
1. **Schema Validation (`validate_schema`)**: Enforces required and optional column definitions.
2. **Business Rules (`validate_business`)**: Validates domain logic (e.g., `High >= Low`).
3. **Historical Context (`validate_historical`)**: Evaluates temporal continuity using the `ValidationContext`.
4. **Scoring (`BaseScoreCalculator`)**: Executed **only** if stages 1-3 pass, assigning a 0-100 quality score based on `ValidationMetrics` (missing % penalty, staleness, etc.).

All findings are packaged into an immutable `DataQualityReport` featuring explicit `schema_failures`, `business_failures`, and `historical_failures` to dramatically improve observability over the deprecated boolean `is_valid` flag. Downstream scanners are abstracted away from these structures and unpack the final `MarketData` wrapper directly.

### 40.3 Cache Decision Engine Merge Policy
The `price_cache.py` ingestion loop explicitly compares incoming data against the cache using a hierarchical formula:
- `RemoteScore = QualityScore × SOURCE_RELIABILITY[source]`
- `CacheScore = QualityScore × SOURCE_RELIABILITY["Cache"]`

If the remote data is inferior, the system executes a **KEEP_CACHE** policy, preserving the local `.parquet` data and marking it as `is_stale`. This guarantees years of accumulated historical data are strictly immunized against sudden API failures or regressions (tracked via the `MAX_HISTORY_SHRINK` threshold).

## 41. Elite Data Validation Framework (V1)

### 41.1 Core Principle

The parser converts bytes/JSON/CSV into a DataFrame or domain object. The validator determines whether it is trustworthy.

```mermaid
flowchart TD
    A[External Source] --> B[Adapter / Parser]
    B --> C[Validation Engine]
    C --> D[MarketData Validated]
    D --> E[Cache / Consumers]
```

### Phase 1 – Inventory Every External Data Source
Create a complete inventory before writing validators. Nothing enters the system until it's classified.

| Dataset | Source | Format | Frequency | Criticality |
|---|---|---|---|---|
| Historical OHLC | Yahoo/Fyers | DataFrame | Daily/Intraday | Critical |
| Bhavcopy | NSE | CSV | Daily | Critical |
| Delivery Data | NSE | CSV | Daily | Critical |
| Index Constituents | NSE | CSV/JSON | Monthly | High |
| Corporate Actions | NSE/BSE | CSV/API | Daily | High |
| Fundamentals | Screener/API | JSON | Daily | High |
| Live Quotes | Fyers | JSON | Seconds | Critical |
| Market Breadth | NSE | JSON | Intraday | Medium |
| Holidays | NSE | CSV | Yearly | Low |
| Symbol Master | NSE | CSV | Weekly | Critical |

### Phase 2 – Dataset Contract
Every dataset should have a formal contract which becomes the specification.
**Example: Bhavcopy Contract**
- **Required Columns:** SYMBOL, SERIES, OPEN, HIGH, LOW, CLOSE, TTL_TRD_QNTY
- **Optional Columns:** DELIV_QTY, DELIV_PER
- **Primary Key:** (SYMBOL)
- **Business Rules:** HIGH >= LOW, OPEN > 0, CLOSE > 0
- **Historical Rules:** Date monotonic, No duplicate symbols

### Phase 3 – Validator Layers
Every validator follows the same pipeline. Only the dataset-specific rules differ.

```mermaid
flowchart TD
    A[Schema Validation] --> B[Type Validation]
    B --> C[Business Rules]
    C --> D[Historical Validation]
    D --> E[Dataset-specific Validation]
    E --> F[Metrics]
    F --> G[Quality Score]
```

### Phase 4 – Dataset-Specific Validators
Each validator owns only its dataset inside the `validators/` directory:
- `price_validator.py`
- `bhavcopy_validator.py`
- `delivery_validator.py`
- `fundamentals_validator.py`
- `corporate_actions_validator.py`
- `live_quote_validator.py`
- `constituents_validator.py`
- `holidays_validator.py`
- `symbol_master_validator.py`

### Phase 5 – Dataset-Specific Business Rules
Every dataset has different rules:
- **Price**: High >= Low, Open > 0, Volume >= 0
- **Bhavcopy**: Series ∈ {EQ, BE, SM...}, DELIV_PER optional, Duplicate SYMBOL not allowed
- **Fundamentals**: ROE between -100 and 1000, Debt >= 0, Market Cap > 0
- **Live Quotes**: Bid <= Ask, LTP within Circuit, Timestamp recent, Volume monotonic
- **Corporate Actions**: Valid Action Type, Future effective dates, Unique event ID

### Phase 6 – Validation Severity
Not every issue should have the same impact:
- **Critical (Reject immediately):** Missing required columns, wrong data types, negative prices, corrupt timestamps.
- **Warning (Accept with reduced quality):** Missing optional fields, minor stale data, low coverage.
- **Info (Log only):** New optional column added, unused metadata.

### Phase 7 – Historical Validation
This is where most systems fail. Every dataset should compare against previous versions:
- **Price**: History shrink, duplicate timestamps, rollback, split anomalies.
- **Bhavcopy**: Symbol count drops, missing sectors, unexpected series changes.
- **Fundamentals**: Market cap collapse, ROE jump, missing companies.
- **Constituents**: Unexpected additions/removals, Weight total ≈100%.

### Phase 8 – Data Provenance
Every validated dataset should carry metadata for debugging:
`Source`, `Provider`, `Validator`, `Validator Version`, `Timestamp`, `Checksum`, `Quality Score`, `Validation Time`

### Phase 9 – Cache Protection
Generalize the cache protection decision engine. Every dataset can reuse this logic:
**KEEP_CACHE** Reasons:
- `HISTORY_SHRINK`
- `SCHEMA_REGRESSION`
- `QUALITY_REGRESSION`
- `TIMESTAMP_ROLLBACK`
- `DUPLICATE_EXPLOSION`

### Phase 10 – Golden Validation Tests
For every validator, maintain static fixtures:
`valid_dataset.csv`, `missing_column.csv`, `duplicate_rows.csv`, `negative_prices.csv`, `future_timestamp.csv`, `history_shrink.csv`, `unknown_optional_column.csv`

### Phase 11 – Validation Dashboard
Track validation quality over time to spot upstream issues before they affect trading:
- Provider Success Rate, Validation Failures, Quality Score Trend, Historical Rejections, Cache Protections Triggered, Schema Changes, Unknown Columns, Dataset Coverage.

### Phase 12 – Onboarding Checklist for New APIs
Any new external API should satisfy a standard checklist before integration:
1. **Source Assessment:** Reliability, update frequency, rate limits, authentication.
2. **Parser:** Convert raw response to canonical format.
3. **Dataset Contract:** Define required/optional fields, types, business rules, keys.
4. **Validator:** Implement schema, business, historical, and dataset-specific validation.
5. **Score Calculator:** Define quality metrics if applicable.
6. **Cache Strategy:** Decide KEEP_CACHE, APPEND, REPLACE, or NO_CACHE.
7. **Golden Test Suite:** Include valid, corrupt, partial, stale, edge-cases.
8. **Monitoring:** Emit structured validation logs and quality metrics.

### End-State Architecture
The long-term goal is simple: the trading system no longer depends on the behavior of Yahoo, NSE, Fyers, or any other provider—it depends on internal validation contracts. If a provider changes its schema or returns partial data, the issue is detected and contained at the boundary.

                },

                    useMaxWidth: true,
                    htmlLabels: true
                }
            });

            // Find all blocks of mermaid tags and convert them into interactive SVG elements
            const codeBlocks = contentDiv.querySelectorAll("pre code");
            codeBlocks.forEach(function (block) {
                const codeText = block.textContent.trim();
                if (codeText.startsWith("sequenceDiagram") || codeText.startsWith("graph") || codeText.startsWith("flowchart")) {
                    const preElement = block.parentNode;
                    const mermaidDiv = document.createElement("div");
                    mermaidDiv.className = "mermaid";
                    mermaidDiv.textContent = codeText;
                    preElement.parentNode.replaceChild(mermaidDiv, preElement);

            });
