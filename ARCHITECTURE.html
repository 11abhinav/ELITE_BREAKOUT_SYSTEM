## 1. Market Regime Definitions & Fallbacks

The system uses two independent regime systems to govern breakout risk. **Rule of thumb: Regimes should tighten quality gates, not blindly kill scans.**

### 1.1 Short-Term Momentum Regime (`macro_utils.get_macro_regime`)
Used by: **EOD, Reversal, Multi-TF Scanners**
Measures: 20-day Nifty return vs ADX trend strength.
- **Trending Market (ADX >= 20):**
  - BULL: > +3.0%
  - BEAR: < -5.0%
  - NEUTRAL: otherwise
- **Rangebound Market (ADX < 20):**
  - BULL: > +5.0%
  - BEAR: < -8.0%
  - NEUTRAL: otherwise

**Fail-Safe:** If API fetch fails or regime cannot be computed, this function MUST default to `NEUTRAL` (not BULL or BEAR). This ensures scans can proceed normally.

### 1.2 Structural Regime (`multibagger.py`)
Used by: **Multibagger System Only**
Measures: Nifty Close vs 200-DMA.
- BULL: Nifty > 200-DMA
- BEAR: Nifty < 200-DMA

**Fail-Safe:** If Nifty data is unavailable or has insufficient history (<200 days), Multibagger MUST default to `BEAR` (conservative fail-direction). Quality-over-quantity dictates we assume high risk if we cannot prove otherwise.

---

## 2. Scanner Reactions to BEAR Regimes

Scanners react to BEAR markets by raising the bar for conviction, not by turning off completely (except Multibagger gating).

| Scanner | Reaction to BEAR |
|---------|------------------|
| **EOD** | Global minimum score threshold raised by +5 (e.g. 82 -> 87) |
| **Multi-TF** | Bayesian engine uses bearish historical weights to penalize weak setups |
| **Multibagger** | No penalty. The Scoring Pipeline already grades weak fundamentals aggressively; no artificial BEAR downgrades are applied to HIGH_QUALITY setups. |
| **Reversal** | No penalty. Reversals naturally occur in weak/bear markets |

---

## 3. Data Freshness & Stale Data Logic

**Weekend & Holiday Integrity (CRITICAL):**
When running EOD or Reversal scanners, `ist_now.date()` may be a non-trading day.
- **NEVER** use `if last_bar.date() != ist_now.date(): reject()` as this will reject the entire universe on weekends.
- **INSTEAD**, use a maximum age check: `_bar_age_days = (ist_now.date() - last_ts.date()).days <= 4` (to cover Fri->Mon and long weekends).

**Timezone Provenance:**
- yfinance `.NS` tickers return **naive timestamps** that represent IST local time.
- If you `tz_localize("UTC")` on a `.NS` ticker, you shift the time by +5.5 hours. At 6:30 PM IST, this pushes the timestamp past midnight into tomorrow, breaking date matching.
- **ALWAYS** localize `.NS` naive timestamps directly to `Asia/Kolkata`.

**Fallback Watchlist Degradation & Degradation Thresholds:**
If the upstream `daily_builder` fails and uses yesterday's fallback watchlist, or if the price caches are rate-limited, the scanners must soft-degrade their health status to `DEGRADED` without hard-aborting. The exact thresholds for status degradation are:
- **EOD Scanner:** Degrades to `DEGRADED` if `stale_count / total_symbols > 0.05` (5%) or if the fetched symbol count is `< 95%` of the watchlist (`eod_scanner.py:764-772`).
- **Reversal Scanner:** Degrades to `DEGRADED` if `stale_count / total_symbols > 0.05` (5%) or if the fetched symbol count is `< 95%` of the watchlist (`reversal_scanner.py:880-888`).
- **Multi-TF Scanner:** Degrades to `DEGRADED` if `total_stale / total_symbols > 0.05` (5%), if any timeframe's fetched count is `< 95%` of expected, or if there are any DB save failures (`multi_tf_scanner.py:786-802`).
- **Multibagger Scanner:** Degrades to `DEGRADED` if the fundamental data load ratio is `< 70%` (`multibagger.py:1208-1217`).

---

## 4. Filter Cascade Anti-Patterns

When building scanner gates, avoid **Structural Contradictions**.

### Anti-Pattern: Reversal vs Trend Contradiction
*Example:* Requiring a stock to be 30% below its 52W High (Reversal) while also requiring `Close >= SMA50` (Trend).
*Why it fails:* A stock 30% down is mathematically almost guaranteed to be below its 50-DMA. The gate will reject 95% of valid setups until they have already recovered 15-20% (too late).
*Solution (Soft Gate):* If below SMA50, check if it is within 3% of reclaiming it (approaching recovery) and above EMA20.

### Anti-Pattern: Window Constraint Contradiction
*Example:* Requiring a fresh MACD Crossover in the last 2 bars for a swing trade.
*Why it fails:* If the scanner runs once a day, the cross might have happened 3-4 days ago on the initial thrust. A 2-bar window rejects stocks that are still perfectly in play.
*Solution:* Expand the window to 5 bars for swing timeframe indicators, or 10 bars for reversal setups.

### Anti-Pattern: Hard Gate vs Soft Scoring Contradiction
*Example:* Using strict Value Investing hard-gates (e.g., ROCE > 15%, Revenue CAGR > 8%) to preemptively filter a Breakout/Momentum scanner.
*Why it fails:* Hard gates act as blind guillotines. Mature blue-chip leaders (like TCS/INFY) that naturally have slower growth (e.g., 5% CAGR) will be instantly killed before they even reach the Scoring Engine, completely starving the breakout alerts.
*Solution:* Use Hard Gates ONLY for baseline survivability (e.g., negative revenue, extreme debt). Let the quantitative Scoring Pipeline grade the metrics (0-100) and balance tradeoffs dynamically.

### Anti-Pattern: Valuation (Margin of Safety) in Breakout Strategies
*Example:* Anchoring the final Composite Score heavily to a Margin of Safety (intrinsic value) requirement.
*Why it fails:* Breakout strategies by definition seek stocks making new highs or exhibiting extreme relative strength. These stocks almost always trade at a premium to calculated fair value. Punishing them heavily for having negative Margin of Safety zeroes out the score of genuine market leaders.
*Solution:* Flatten the Valuation penalty curve. Only penalize absurd mania pricing (e.g., MoS < -50%). Treat premium-priced quality (MoS -10% to -30%) as acceptable context rather than a fatal flaw.

---

## 5. Admin Manual Triggers (Market Bypass)

Whenever an administrator manually triggers a scanner (e.g., via the dashboard UI), the scanner runner receives a `run_once=True` or `force=True` flag. 
**Architectural Rule:** All scanners MUST interpret this flag as an explicit override to bypass the `is_market_open()` check. If `run_once=True` or `force=True`, the scanner must execute immediately, even if it is a weekend or outside of market hours, and must save alerts to the database without operating in test mode.

---

## 6. Caching & Rate Limit Protections

### 6.1 Shared Price-Fetch Layer Caching (`price_cache.py`)
To avoid rate limits and useless API calls when the market is closed, `_download_all_robust()` checks if the locally cached Parquet file is up to date before fetching.
- **Cache Integrity Check (`_is_cache_up_to_date()`):** Returns true if the cache contains data up to the last market close (15:30 IST).
  - **Weekends:** Evaluates against Friday's 15:30 close.
  - **Weekdays (Off-Hours):** Evaluates against today's 15:30 close (if now > 15:30 IST) or yesterday's 15:30 close (if now < 09:15 IST).
  - **Market Active Hours (09:15 - 15:30 IST):** The cache optimization is suspended, returning `False` to guarantee live intraday and daily candles are pulled.
  - **Intraday Buffer:** Allows a 30-minute buffer for early broker closures (e.g. 15:25 candle).
  - **Serialization Lock (`_fetch_lock`):** Serializes all concurrent price-fetch queries to prevent rate limits and thundering herd API spam.

---

## 7. Wealth Engine: Dual-Gate Signal Architecture

The Wealth Engine completely avoids the "Hard Gate vs Soft Scoring Contradiction" (see section 4) by utilizing a strictly tiered **Dual-Gate Architecture** for generating Buy Signals:

### Gate 1: The Bucket Prerequisite (Quality Enforcement)
A stock is evaluated against 4 rigid fundamental templates (Core Compounder, Growth Multiplier, Quality-On-Sale, Opportunistic). These act as strict Hard Gates:
- **Core Compounder:** `score >= 65`, `mcap >= 10000 Cr`, `roce >= 20%`, `roe >= 15%`, `de <= 0.5`.
- **Growth Multiplier:** `score >= 60`, `mcap >= 2000 Cr`, `yoy_sales >= 20%`, `yoy_profit >= 20%`, `rs_6m >= 0`, `dist_52w <= 15%`.
- **Quality-On-Sale:** `score >= 50`, `roce >= 15%`, `dist_52w >= 20%`, `de <= 1.0`.
- **Opportunistic:** `score >= 55`, `yoy_profit >= 40%`, `rs_6m >= 15%`, and "SME" not in categories.
- **Architectural Rule:** *A stock MUST pass the Bucket Prerequisite to even be evaluated for a Buy signal.* This prevents low-quality anomalies (e.g. poor ROCE with temporary momentum) from polluting the alert stream.

### Gate 2: The Timing Check (Value + Momentum)
If a stock safely lands in a bucket, it is then subjected to the Timing Gates:
- **Baseline Fundamentals:** `FM_Score >= 55`, `Consistency_Score >= 15`, `Valuation_Score >= 5`.
- **Momentum Strength:** `momentum_score >= 25` (Waiting for Momentum if < 25), `momentum_confidence != "LOW"`.
- **Trend Confirmation:** `Close (cmp) > 200 SMA (sma) > 0`.

By cleanly separating the Structural Quality (Gate 1) from the Tactical Entry (Gate 2), the system guarantees that every buy signal is both highly durable and actively trending.

## 8. Daily Builder: Exchange Routing and Junk Filtration

The Daily Builder script builds the primary watchlist universe by querying third-party fundamental data. It enforces the following core architectural rules:

### 8.1 Cross-Exchange Deduplication
- **Universal Capture:** To capture BSE-exclusive value opportunities, the TradingView query retrieves both `"NSE"` and `"BSE"` exchange data.
- **De-duplication Policy:** To avoid duplicate processing of cross-listed companies, the raw scan must be sorted descending by `ticker` (placing `"NSE:"` above `"BSE:"`) and deduplicated on the `name` column using a `"first"` match constraint. This guarantees a clean, single-record representation per ticker, preferring the liquid NSE listings where available.

### 8.2 Promoter Holdings & Market Cap Gates
- **Shell Prevention:** To block shell companies with artificial capital metrics, the system filters out companies whose promoter-backed market cap is below `MIN_PROMOTER_MCAP` (₹500 Cr).
- **Float-Based Calculation:** Since direct promoter holdings percentages are prone to missing API data, the builder computes the promoter holdings ratio via shares outstanding:
  $$\text{Promoter MCAP} = \frac{\text{Total Shares Outstanding} - \text{Float Shares Outstanding}}{\text{Total Shares Outstanding}} \times \text{Market Capitalization}$$
- **Mandatory Validation:** The calculated Promoter MCAP must be actively compared against `MIN_PROMOTER_MCAP` in both financial and non-financial pipelines. Any stock failing this check must be skipped.

### 8.3 Transient Database Lag Resilience
- **Soft Evaluation vs. Hard Skips:** Transient quarterly database lags (missing QoQ sales/profit growth fields) must never lead to a hard exclusion at the classification gate.
- **Scoring Penalization:** The stock should be allowed to proceed through classification (subject to standard annual criteria), but receives zero points in the scoring engine for the missing parameters. This automatically lowers its rank on the leaderboard while preventing system blindness.

## 9. Database & Persistence Principles

### Generic DataFrame to Table (`save_df_to_table`)
When using `database.py:save_df_to_table()` to persist a daily snapshot (like `daily_watchlist`) where the primary key is just the symbol (e.g. `PRIMARY KEY ("Stock")`), it attempts to clean up the table by deleting rows older than today.

**CRITICAL LESSON:** Always guard against orphaned `NULL` values when performing time-series cleanups on snapshot tables.
- **The Bug:** `DELETE FROM table WHERE "Date" < 'today'` will silently skip any rows where `Date` is `NULL`. When the script then attempts to `INSERT` today's fresh data for a stock that was orphaned, it will hit a `UniqueViolation` on the primary key and crash the pipeline.
- **The Fix:** The cleanup logic must explicitly target `IS NULL`. The correct purge sequence is:
  `DELETE FROM table WHERE "Date" IS NULL OR "Date" < today_str`

### Multi-TF Pipeline: State Transition Context Clearing
When Phase A evaluates the hourly timeframe and assigns a stock the `HOURLY_APPROVED` status, it must explicitly clear any lingering state attributes (`expires_at`, `invalidated_at`, `cooldown_until`) from previous sessions.
- **The Bug:** The DB `upsert_breakout_watchlist` uses `COALESCE(EXCLUDED.invalidated_at, breakout_watchlist.invalidated_at)` to protect existing state during minor updates. If Phase A doesn't explicitly wipe these fields, the DB preserves yesterday's `invalidated_at`. Phase B will then silently drop the stock on the next query because `invalidated_at > NOW()` evaluates to False.
- **The Fix:** Phase A must pass `clear_context=True, force=True`, and the underlying database logic must execute an explicit `UPDATE SET invalidated_at = NULL, cooldown_until = NULL` before proceeding with the `ON CONFLICT DO UPDATE`.

### Multi-TF Pipeline: Session Transition State Resets and Expiry Mechanics
To prevent false positive buy alerts during the volatile market-open period, the system enforces a strict end-of-session state reset and expiration sweeper (`sweep_stale_breakout_watchlist`):

- **End-of-Session Resets (Resetting Intraday Triggers):**
  At the end of the day, any setups that were in `BREAKOUT_CONFIRMED` or `ENTRY_READY` but didn't trigger an active trade are updated:
  * `current_state` is set back to `SETUP_ARMED`.
  * `m15_status` and `m5_status` are set back to `PENDING`.
  
  *Rationale:* If setups stayed as `ENTRY_READY` overnight, they would bypass the 15-minute micro-alignment check (Phase C) on the following morning. During the market open, the 5m trigger (Phase D) would compare the opening 5-minute candle against the 3:25 PM candle from yesterday. Because opening volume and price movements are anomalously high, the system would immediately trigger a false positive "thrust" breakout on normal opening volatility. Resetting forces the stock to re-verify its 15m trend alignment and coiling proximity today before it is allowed to trade.

- **Intraday Expirations:**
  During active market hours, all new `HOURLY_APPROVED` setups have their database `expires_at` timestamp set to today's market close (**15:30 IST**). Once the session ends, the background sweeper marks these expired setups as `FAILED` (invalidated), clearing them from the active list. For post-market diagnostics or manual testing after 15:30 IST, setups are written with a short 15-minute TTL (`expires_at = now + 15 minutes`) before being swept to `FAILED`.

## 10. Promoter Pledge Data Handling & Null Safety

```mermaid
sequenceDiagram
    participant WebServer as Flask Web Server
    participant DB as Postgres Database
    participant Scraper as Pledge Worker Daemon
    participant NSE as NSE Website (Constituents)

    Note over Scraper: Background Loop Starts
    Scraper->>NSE: Fetch Nifty constituents (Cached 1 day)
    Scraper->>DB: Build target Watchlist + Excluded universe
    Scraper->>DB: Query cached pledge records
    Scraper->>DB: Write progress to scanner_health table (non-blocking)
    
    Note over WebServer: Admin Clicks Refresh
    WebServer->>DB: Query scanner_health status row
    alt Health row empty
        WebServer->>DB: Quick dynamic count fallback (<2ms)
    end
    WebServer-->>Dashboard: Return JSON progress metrics
```

### 10.1 Sentinel Handling and Null Propagation
- **DB Sentinel Representation:** The pledge scraper (`pledge_worker.py`) stores a sentinel value of `-1.0` in `promoter_pledge_cache` to indicate a fetch failure (such as a 404 error, missing pledge page text, or API timeout) and sets a 7-day retry cooldown.
- **Null Safety in Scrapers:** The fetcher (`fetch_promoter_pledge()`) must map this `-1.0` sentinel as well as any missing DB cache records to Python's `None` (representing an unknown/unverified state) instead of defaulting to `0.0` (which is a perfect score of no pledge).
- **Quality Gate Tolerance (No-Data Bypass):** Downstream scanners and kill gates (e.g., Multibagger Quality Gate checking `pledge > 0.20` and core `Kill Gates` checking `pledge > 0.50`) must explicitly allow `None`/`NaN` to pass the gate. They must **not** fail the gate on missing data to prevent temporary scraper/network errors from hard-excluding healthy stocks (preventing high false-negative exclusion rates).
- **No Score Advantage:** Although missing data passes the gate, it must not be treated as a `0%` pledge in any scoring evaluations (e.g., in `wealth_engine.py` scoring). Since it is `None`, it is excluded from receiving the score bonuses that are strictly reserved for verified `0%` pledge holdings (which receive a `+10` points bonus).

### 10.2 Non-Blocking Progress Metrics & Attempt Tracking
- **Progress Tracking Column:** The `promoter_pledge_cache` database table contains a `last_attempted_at` timestamp column. Every time the worker processes a stock (whether the scrape succeeds, returns missing/404, or hard-fails), it sets `last_attempted_at = NOW()`.
- **Cumulative Processed Progress:** The progress metrics display the **cumulative processed counts** (already up-to-date from previous days + today's processed) against the **total combined universe size** (watchlist + excluded + constituents). For example, it starts around `1126 / 1181` and increments to `1181 / 1181` on success.
- **Non-Blocking Status Dashboard Refresh:** To prevent the web server dashboard status API `/api/scanner_status` from freezing when querying progress metrics, all slow external network dependencies (such as downloading index constituents from the NSE website) are kept out of the web server request thread.
- **Delegated Metric Updates:** The background `Pledge Worker` daemon compiles the stale universe and writes its own live progress counts (`today_alerts` representing processed today, and `total_count` representing total eligible today) directly to the `scanner_health` database table.
- **Database-Driven Fallback:** If the database health columns are empty/null (e.g., on first boot before the loop updates), the dashboard status API dynamically queries the database tables (`daily_watchlist` and `daily_excluded_watchlist`) directly to reconstruct the universe and calculate the cumulative status metrics in less than 2ms.
- **Constituents Caching:** To prevent overloading the NSE site, the constituents list is cached in memory for the current calendar day (fetched at most once per day). Subsequent loops reuse the cache instantly (0ms with no network calls).

## 11. AI Worker Daemon & Manual Trigger Architecture

```mermaid
graph TD
    A[Background Daemon Schedule] -->|Check 7PM - 7AM IST| B{Lock Free?}
    C[Admin Manual Trigger] -->|Click Scan| B
    B -->|No| D[Reject Execution]
    B -->|Yes| E[Acquire _scan_lock]
    E -->|1. Read Transcripts| F[Analyze Concall]
    F -->|2. Analysis Successful?| G{Success?}
    G -->|Yes| H[Cache 60 Days]
    G -->|No| I[Cache 1 Day retry]
    H --> J[Release Lock]
    I --> J
```

### 11.1 Background Execution & Scheduling Window
The `AI Worker` runs continuously as a background daemon thread (`run_worker_loop` under `RESTARTABLE_THREADS` in `main.py`). It is active during its designated scheduling window of **7 PM to 7 AM IST**, checking every 5 minutes for missing concall cache records and analyzing them.

### 11.2 Single-Scan Extraction & Thread Safety
- **Core Scan Extraction:** The concall extraction logic is separated from the infinite loop into `run_ai_worker_scan_once()`.
- **Manual Trigger:** The admin dashboard control endpoint is mapped to `"AI Worker"`, allowing administrators to manually trigger a single full scan cycle on-demand.
- **Execution Lock:** To prevent manual scans from overlapping with background scheduled scans or causing API rate-limit starvation, a threading lock (`_scan_lock`) protects the execution. If a scan is already running, subsequent manual triggers are rejected immediately with a warning.

### 11.3 Expiration and Retry Policy (Dynamic Caching)
- **Successful Cache Expiration:** Valid AI concall analyses (not containing `"error"`) are cached with a **60-day expiration window** (approx. one earnings season). The worker checks Nifty/NSE for fresh transcripts once this window expires.
- **Failed Cache Expiration (Negative Cache):** Any failed fetch or analysis (where the returned JSON contains an `"error"` field) is cached with a **1-day expiration window**. This prevents the worker from repeatedly querying failed stocks or consuming API quotas on the same day, while ensuring they are automatically retried on the next day's run.

### 11.4 Wealth Engine Scoring Integration
- **Soft Integration & Graceful Failure:** If a symbol has no cached AI concall analysis or the cache query fails, the Wealth Engine defaults `AI_Confidence` to `0`. It does **not** reject or filter the stock, ensuring quantitative evaluation continues uninterrupted.
- **Alpha Adjustments Rubric:** Under Gate 5 of the Wealth Engine scoring rubric:
  - `AI_Confidence >= 7` adds a **`+15` points bonus** to the composite score.
  - `AI_Confidence >= 4` adds a **`+5` points bonus** to the composite score.
  - The final score is capped at `100`. High AI confidence directly increases the stock's visibility on the leaderboards.

### 12.1 BSE-Only Listings & Default Normalization
- **Default Exchange Normalization:** The system default is to normalize raw symbol names to `.NS` (NSE) for fetching pricing/OHLCV data from Yahoo Finance.

- **Single Ticker Fallback:** For single-ticker OHLCV fetches (`get_ohlcv`) and quotes (`get_quote`), if the primary `.NS` fetch returns empty or fails, the fetcher immediately retries with the `.BO` (BSE) equivalent.
- **Batch Deduplication & Single-BSE-Batch Query:** For batch queries (`get_batch_ohlcv`), symbols that fail to return data during the initial `.NS` batch call are collected and resolved in exactly **one single BSE batch query** (replacing the suffix with `.BO`). This avoids thundering rate-limit storms of individual single-symbol calls.

## 16. Persistent BSE Fallback Mapping Architecture

To support BSE-exclusive listings (such as SME or recently listed companies like `NSDL`, `YASHHV`, `CIANAGRO` which do not trade on NSE) without cluttering logs with redundant `Quote not found / possibly delisted` warnings, the system employs a persistent fallback mapping architecture.

### 16.1 Mappings Schema & Storage
* **File Location:** `data/bse_symbol_mappings.json`
* **Format:** Standard JSON key-value dictionary, mapping the base alphabetical symbol to its verified Yahoo Finance BSE ticker format (e.g. `{"YASHHV": "YASHHV.BO"}`).

### 16.2 Resolution & Fallback Flow
1. **Cache Inspection:** During symbol normalization (`_normalize_symbol` in `app/data_provider.py`, `_symbol_to_yf` in `app/price_fetcher.py`, `app/live_prices.py`, etc.), the system loads the JSON cache. If the symbol (or its `.NS` version) exists in the cache, it routes directly to the mapped `.BO` target.
2. **First-Time Try & Fallback:** If a symbol is not in the cache, the system attempts the default NSE fetch first. If the NSE query returns empty or raises an exception, the provider dynamically:
   - Formulates the BSE equivalent (`.BO` suffix).
   - Retries the download.
   - If the BSE fallback succeeds, it dynamically registers the mapping by appending it to `data/bse_symbol_mappings.json`.
3. **Efficiency gains:** Subsequent cycles immediately query the cached BSE ticker directly. No `.NS` query is ever attempted again, completely avoiding redundant rate limits, delay retries, and error logs.

## 17. Unified Market Data Fetching & NSE Surveillance Caching

### 17.1 Centralized Fyers-First Data Routing
To prevent redundant rate limiting and code duplication across the ecosystem, all data requests (Multibagger bulk downloads, Nifty Macro regimes, live Dashboard CMPs, and Wealth Engine pricing) are routed through a singular, factory-based `get_fetcher()` abstraction located in `data_provider.py`.
- **Primary Source (Fyers):** If the Fyers API token is valid, data is streamed rapidly through `FyersFetcher`.
- **Secondary Fallback (Yahoo Finance):** If Fyers is unauthenticated or fails, `AutoSwitchingFetcher` automatically degrades gracefully to `YFinanceFetcher`.
- **Legacy Elimination:** The duplicate `price_fetcher.py` file has been completely removed to enforce this single point of routing truth.

### 17.2 Surveillance Network Resilience
- **Rapid Timeouts:** Background scanner dependencies (such as NSE ASM/GSM surveillance lists) operate with strict 5-second `curl_cffi` network timeouts, preventing temporary NSE website blocks from indefinitely locking the backend execution threads.
- **Persistent JSON Fallback:** On successful surveillance fetches, the lists are saved to a local JSON cache (`data/surveillance_blacklist.json`). If the cloud server's IP is blocked by NSE during subsequent loops, the system automatically falls back to loading this local JSON file. This guarantees that background loops never fail completely and always operate with the most recently known valid blacklist.

### 17.3 The Fetcher Fallback Contract & Drop-Out Protection
- **Strict Return Schemas:** When batch fetching via `get_batch_ohlcv`, both `FyersFetcher` and `YFinanceFetcher` are bound by a strict contract: they **MUST** return a dictionary containing keys for *every* symbol requested, even if the value is `None`. 
- **Preventing Silent Drops:** If a fetcher is rate-limited, blocked, or a circuit breaker trips, returning an empty `{}` would cause the upstream cache manager (`price_cache.py`) to bypass its fallback stale-cache injection, silently omitting all failed symbols from downstream engines like Wealth and Reversal (triggering "Incomplete Data" abortions). The strict contract guarantees the cache manager detects all missing data and activates the necessary fallbacks safely.

## 18. Scanner Stop-Loss (SL) and Target (TGT) Architecture (Auditing & Logic)

The system utilizes a centralized, mode-dispatching SL/Target engine (`sl_target_helper.py`) for all scanners except Multibagger. A core principle of this engine is the **Anti-Operator-Trap Design**: retail traders typically place stops exactly at swing lows, making them vulnerable to institutional stop-hunting wicks. To combat this, the system places SLs *below* the structural support zones with a dynamically calculated buffer.

### 18.1 Core Anti-Trap Mechanics
- **Dynamic Buffering:** SL is buffered by `max(mode_atr_fraction × ATR, mode_pct × price)`.
- **ADX-Aware Scaling:** Trending stocks (ADX > 35) receive up to a 30% wider SL buffer. Deep trends experience deeper pullbacks, and this prevents premature stop-outs.
- **Multi-Swing Clustering:** Scans the last 3 swing lows. If 2+ cluster within 1% of each other, the system anchors the SL to this clustered zone, as it represents significantly stronger institutional support.
- **Target Capping:** Prevents unrealistic targets by hard-capping target extensions based on macro conditions.

### Key V6.4 Features
- **Structural Discovery:** Dynamically locates technical pillars (e.g., VWAP, Swing Low clusters, Fibonacci extensions) to anchor targets and stops, rather than blindly relying on static ATR offsets.
- **Natural RR / Reward Potential Gates:** A trade must pass minimum Reward:Risk ratio gates before it is even saved. If the nearest structural resistance is too close to the entry price, the trade is rejected (e.g., `GATE_NATURAL_RR`).
- **Target Capping by Regime:** To prevent unrealistic target projections during volatile or bearish markets, `target_1`, `target_2`, and `target_3` are strictly capped based on the current Macro Regime. Bear regimes constrain ATR projection, while Bull regimes allow targets to breathe.
- **Multi-Target Scaling:** 
  - **T1 (Primary):** Anchored to nearest structural resistance.
  - **T2 (Secondary):** 1.5x Risk/ATR projection, capped by regime constraints.
  - **T3 (Runner):** 3.0x Risk/ATR projection, capped by regime constraints.
- **Exit Monitor Integration:** The Performance Tracker executes sequential partial exits (e.g., 25% at T1, 35% at T2, 40% at T3). It evaluates tick/bar data and can handle multiple target hits in a single massive candle seamlessly. Gap Downs below SL execute precisely at the Open price.

#### 18.1.1 Dynamic Support Selection Cascade (For Stop-Loss Anchoring)
Stop-Loss levels are **never hardcoded**. The system dynamically searches below the entry price for the strongest structural support using a strict priority cascade (`_pick_support`):
1. **Swing Low Cluster:** (Strongest) Average of 2+ swing lows clustered within 1% of each other.
2. **Pivot Swing Low:** The nearest true technical pivot low.
3. **Pivot S1:** Standard floor pivot support.
4. **Rolling Swing Low:** Local n-period rolling window low (fallback).
5. **Pivot S2:** Deeper floor pivot support.
*(If no structural support exists, it falls back to a strict minimum ATR distance).*

#### 18.1.2 Dynamic Resistance Selection Cascade (For Target Anchoring)
Breakout targets are **never hardcoded** multipliers. The system dynamically anchors T1 to the nearest logical structural resistance above the entry price using this priority cascade (`_pick_resistance`):
1. **Pivot Swing High:** The nearest true technical pivot high.
2. **Pivot R1:** Standard ceiling pivot resistance.
3. **Bollinger Upper Band:** Volatility ceiling limit.
4. **Rolling Swing High:** Local n-period rolling window high.
5. **Pivot R2:** Deeper ceiling pivot resistance.
*(If overhead resistance is too close, the target is artificially bumped to meet the minimum Risk-to-Reward ratio).*

### 18.2 EOD Scanner (Daily Breakout)
- **Trade Thesis:** Swing trade, holding days to weeks.
- **Stop-Loss:** **Dynamic.** Anchored to the support identified by the *Support Selection Cascade*, then buffered by 0.75×ATR (or 0.75%). Capped at 3.0×ATR.
- **Targets:**
  - **T1:** **Dynamic.** Anchored to the resistance identified by the *Resistance Selection Cascade* (usually Swing High or R1). Must meet a minimum **2.0:1** Risk-to-Reward (RR) ratio.
  - **T2:** R2 or 3.5×RR (Disabled if RSI is Overbought).
  - **T3:** 5.0×RR, activated only on strong confluence (Bullish MACD + ADX > 25) to hold for a parabolic run.
- **Trailing Rule:** "Raise SL to breakeven after T1 is hit."

### 18.3 Intraday Scanner (15m Momentum Scalp)
- **Trade Thesis:** Early-momentum scalp, holding for the same day.
- **Stop-Loss:** **Dynamic.** Priority 1: **VWAP-Anchored** (if VWAP falls between the entry price and the triggering candle's low). Priority 2: The triggering candle's own low + 0.5×ATR buffer. Priority 3: Fallback to the *Support Selection Cascade*.
- **Targets:**
  - **T1:** **Dynamic.** Anchored to the resistance identified by the *Resistance Selection Cascade* (usually Session High, R1, or BB Upper Band). Must meet a min **1.5:1** RR.
  - **T2:** R1 or 2.5×RR.
  - **T3:** NONE (Intraday does not hold for extended targets).
- **Trailing Rule:** "Hold position until SL or Target is hit."

### 18.4 Multi-TF / LIVE_1H Scanner (Hourly Swing)
- **Trade Thesis:** Hourly swing continuation, holding 1-5 days.
- **Stop-Loss:** **Dynamic.** VWAP-anchored (if valid) OR anchored to the support identified by the *Support Selection Cascade* (usually last hourly swing low) + 0.5×ATR buffer.
- **Targets:**
  - **T1:** **Dynamic.** Anchored to the resistance identified by the *Resistance Selection Cascade* (usually R1 or Swing High). Must meet a min **2.0:1** RR.
  - **T2:** R2 or 3.0×RR (Disabled if RSI is Overbought).
  - **T3:** NONE.
- **Trailing Rule:** "Trail SL to last hourly swing low after T1 is hit."

### 18.5 Reversal Scanner (Counter-Trend Oversold)
- **Trade Thesis:** Mean reversion bounce, holding days to weeks. (Volatility is extremely high).
- **Stop-Loss:** **Dynamic.** Anchored to the recent oversold swing low (via *Support Selection Cascade*) with a **WIDE buffer** (1.0×ATR or 1.00%). The wide buffer is an absolute necessity because beaten-down stocks have massive daily ranges.
- **Targets (Mean Reversion based, NOT resistance based):**
  - **T1:** **Dynamic Mean.** Bollinger Mid-Band (BB_MID) or SMA50. These stocks have heavy overhead resistance, so the target is the magnetic mean, not a structural high. Min **2.0:1** RR.
  - **T2:** SMA50 (if not T1) or R1 (further recovery).
  - **T3:** R2, activated only on strong MACD + ADX > 20.
- **Trailing Rule:** "Book 50% at T1 (EMA20). Trail remainder to breakeven."

### 18.6 Multibagger Scanner (Value Investing)
- **Routing:** Multibagger is part of the standard breakout ecosystem. Its alerts are routed to the `ALL_TRADES` table and appear on the Admin and User dashboards.
- **Stop-Loss:** `0.0` (None). Multibagger operates on a long-term value accumulation thesis. Strict stop-losses are not applied, as price drops in fundamentally stellar, low-debt companies are treated as accumulating opportunities rather than invalidations.

### 18.7 Wealth System / Dashboard (Separate Entity)
- **Routing:** The Wealth System uses its own fundamental evaluation logic (the V5 pipeline). Its alerts ("New Wealth Buy Alert" / "Position Closed") are completely isolated from `ALL_TRADES` and live exclusively in the dedicated **Wealth Dashboard**. They do not show up in the standard admin/user tables.
- **Targets:** Intrinsic Valuation targets. The system computes a `target_multiple` by averaging Graham Intrinsic Value and DCF models (factoring in Margin of Safety), establishing a fair-value exit horizon rather than a technical trading target.

## 19. Price Cache Engine & Delta-Fetching Architecture

To minimize network latency, avoid API rate limits, and enable ultra-fast background scanner loops, the Elite Breakout System implements a robust local disk-caching architecture (`app/price_cache.py`). This engine stores historical OHLCV data in highly compressed Parquet format within `data/history/<interval>/`.

### 19.1 Delta vs. Full Fetching Logic
The system intelligently decides what data to fetch to minimize network load. When a scanner requests data for a watchlist, the engine evaluates each ticker:
1. **Cache Existence:** Does `data/history/<interval>/<symbol>.parquet` exist?
   - If **NO**: Symbol is queued for a **FULL** fetch (e.g., download full 2 years of history).
2. **Up-To-Date Check (`_is_cache_up_to_date`):** If the cache exists, the system compares the last timestamp against the current market timestamp.
   - If the last timestamp is exactly the end of the previous trading day (or today's live close), the cache is marked as up to date.
3. **Length Validation (`_is_cache_long_enough`):** Ensures the local cache contains enough historical bars to satisfy the current scanner's `period` requirement (e.g. 1 year vs 1 month).
4. **Queue Assignment:**
   - **Fully Up-To-Date & Long Enough:** Returns the cached DataFrame instantly without any network calls (`0 API hits`).
   - **Long Enough, but Stale (e.g. missing today):** Queues symbol for a **DELTA** fetch. The system only downloads the missing bars (e.g. `start_date=Yesterday`, `end=Today`), and seamlessly concatenates them with the existing local cache.
   - **Not Long Enough:** Even if up to date, if the scanner requires 2 years but the cache only has 1 month, it falls through and queues the symbol for a **FULL** fetch, overwriting the old short cache.

### 19.2 Timezone Normalization Boundary
Data providers (Fyers, Yahoo Finance) return timestamps in arbitrary and sometimes mixed timezones (UTC vs IST). The Price Cache Engine acts as the strict normalization boundary:
- Before any concatenation occurs, all incoming dates and indices are strictly cast to `Asia/Kolkata` (IST).
- Local cached data loaded from Parquet is also immediately localized to IST upon loading.
- Deduplication is strictly enforced by `drop_duplicates(subset=['Datetime'], keep='last')` to ensure overlapping delta fetches do not create duplicate rows.

### 19.3 Rate-Limit Fallbacks and Graceful Degradation
- **Stale Fallback:** If a Delta or Full fetch fails (due to rate limiting or connection drop), the system automatically degrades gracefully by marking the existing local cache as `is_stale=True` and returning it to the scanner. This allows the scanner to continue running on yesterday's data instead of crashing completely.
- **Error Tracking (`no_data_after_fetch`):** If a ticker is requested, lacks a valid local cache, and fails the fresh API fetch, it is explicitly excluded from the return dictionary and flagged as `no_data_after_fetch` in the tracking database to alert administrators.

## 20. Institutional Risk Engine v2.0

The `sl_target_helper.py` acts as the core engine determining Stop Losses, Target exits, and Position Sizing. In v2.0, the codebase shifted from simple technical scripts to an Object-Oriented Adapter Pattern enforcing quantitative institutional mechanics.

### 20.1 Architecture and Adapter Pattern
Instead of hardcoded functions per scanner, all risk math is centralized in `BaseRiskEngine`. The scanner engines (`BreakoutAdapter`, `ReversalAdapter`, `IntradayAdapter`, `HourlyAdapter`) inherit from this class to inject scanner-specific behaviors like **Time Stops** and **Historical Base Rates (Win Rate & Average RR)**.

### 20.2 Sub-Engines and Independence
The engine is broken down into sub-components to prevent Trade Quality from inappropriately skewing physical Stop Loss geometry:
- **Trade Quality Engine:** Scored via ADX (Trend) and RSI (Momentum).
- **Support Confidence Engine:** Scores the validity of the support anchor by assessing its proximity to moving averages, age, and volume.
- **Volatility Regime Engine:** Classifies the current environment as `HIGH`, `NORMAL`, or `LOW` based on ATR percentiles.

### 20.3 Pre-Production and Risk Limits
The system enforces several strict institutional risk guards before returning metrics:
- **Target Clustering:** Instead of just outputting `min(swing_high, 2*RR)`, targets are formed by a weighted consensus map comprising Fibonacci extensions, measured moves, VWAP, ATR projections, and Pivot Rs. The weights automatically normalize to sum to 100%.
- **Kelly Risk Capping:** Position sizing is scaled by a fraction of the Kelly Criterion dictated by Trade Quality. However, a strict ceiling `MAX_RISK_LIMIT = 2.0%` enforces that no individual trade exposes more than 2% account equity, overriding aggressive Kelly suggestions.
- **Diagnostics and Explainability:** The system logs an internal payload of `warnings` (e.g. *"Target very close to resistance"*) and a deep `diagnostics` footprint revealing the source of the support, the source of the target, and the underlying mathematical components driving the Stop-Loss geometry.

## 21. Multi-Target Portfolio Extensibility

The system supports a robust multi-target matrix (T1, T2, T3) instead of a monolithic single target logic.

### 21.1 Tiered Exit Strategies
All alert tables and database schemas natively record `target_1`, `target_2`, and `target_3`. The `sl_target_helper.py` engine computes these dynamically via cascading R:R (Risk-to-Reward) ratios and technical structural caps. This unlocks partial-booking capabilities for portfolio engines.

### 21.2 Off-Market Performance Optimization
To prevent API rate limit abuse and protect `current_price` metrics during off-market hours, `performance_tracker.py` uses dual-mode initialization:
- **Active Market (`is_market_open() == True`):** Fetches real-time prices via the central data routing layer.
- **Closed Market:** Aborts real-time fetching and preserves the last-known `current_price` cached in the database, preventing P&L column obliteration during off-hours.
- **Admin Overrides (`force_live_fetch=True`):** Authorized manual triggers (via the Scanner Health grid) bypass the off-market gate to perform single-shot data recalibrations.

### 21.3 Universal UI Sorting (Data-Agnostic)
The web interface standardizes all `<table>` elements with a frontend DOM-based sorting algorithm (`table_sorter.js`). The script auto-detects column data types (Currency, Percentages, Dates, Strings) via Regex parsing. This decouples the backend logic from presentation requirements, ensuring tables can be sorted dynamically without issuing database `ORDER BY` API calls.

### 21.4 Trade Lifecycle State Machine & Allowed Statuses
To support partial profit-booking and risk management, trade outcomes transition dynamically through the following status states inside `performance_tracker.py` and `database.py`:
- **`OPEN`**: Default status when an alert is first created and active.
- **`PARTIAL_WIN_1`**: Triggered when the price hits the first target (`target_1`). 25% of the position is closed, and the stop-loss is raised to the entry price (breakeven).
- **`PARTIAL_WIN_2`**: Triggered when the price hits the second target (`target_2`) from `PARTIAL_WIN_1`. 35% of the position is closed, and the stop-loss is raised to `target_1`.
- **`WIN`**: Final state when either:
  1. The final target (`target_3`) is hit.
  2. The trailing stop-loss is hit on a position that has already booked a partial profit (i.e., status was `PARTIAL_WIN_1` or `PARTIAL_WIN_2`).
- **`LOSS`**: Final state when the stop-loss is hit on a position that is still in `OPEN` status (no partial profit has been booked).
- **`NEUTRAL`**: A custom final state manually assigned by the administrator through the dashboard manual judgement option.
- **`CLOSED`**: Final fallback state representing a closed position.

## 22. Scanner Concurrency & Performance Rebuild Locks

### 22.1 The Asynchronous Debounced Rebuild Strategy
- **The Bug:** Originally, `build_performance_data()` was called as a post-scan hook by every scanner and every alert action (accept, reject, reallocate). When decoupled to rely *only* on a 5-minute background loop, this caused a significant UI lag where newly generated scanner signals or manual action updates would not reflect on the "All Trades" dashboard table until the next scheduler cycle (taking up to 5 minutes).
- **The Fix:** Implement `trigger_performance_rebuild()` using a dedicated `_perf_rebuild_lock` with `blocking=False` in an asynchronous thread. When EOD/scanners complete or alert actions are clicked, they invoke this function. The thread exits immediately (no-op) if a rebuild is already running, completely eliminating rebuild storms. If idle, it acquires the lock, waits to serialize safely with active scanners on `main.scanner_execution_lock`, and executes `build_performance_data()`. This updates the UI within seconds of changes while keeping the request/main thread completely responsive.

### 22.2 Lock Decoupling for Live Updates
- **The Bug:** Originally, the background rebuild thread (`trigger_performance_rebuild`) blockingly waited on `main.scanner_execution_lock`. Because scanners can run for several minutes (fetching data and running filters), the performance data build was delayed. Newly generated scanner signals or manual actions (accept/reject) would not update the dashboard until the entire scan completed.
- **The Fix:** The `scanner_execution_lock` check was removed from the performance rebuild process. Since database transactions are safe (Postgres row-level locks) and API rate limits are governed globally by `yf_rate_limiter.py` (which uses a concurrent semaphore of 6 and a minimum interval of 1.25s), the performance rebuild thread can safely run concurrently with scanners. In addition, a `trigger_performance_rebuild()` call was wired directly into the alert insertion pipeline (`save_alert_if_new()`). This ensures that when a new alert is generated, the performance data is updated immediately, allowing the trade to show up on the dashboard "All Trades" table instantly when the user clicks the push notification.

## 23. Bayesian ML Feedback Loop (Dynamic Weighting)

### 23.1 The Train Partition Feedback Loop
To adapt dynamically to evolving market cycles, the system implements a Bayesian Feedback Loop (`bayesian_updater.py`). The engine evaluates closed trades marked as `WIN` or `LOSS` strictly within the `TRAIN` partition of the `alerts` table. It computes a trailing win rate.

### 23.2 Administrative Approval Gateway
Rather than directly writing model parameter weights to production, the updater runs a simplified Bayesian shift calculation. If it detects a feature (such as `VOLUME_ZSCORE`) that is demonstrating higher predictive power in winning trades, it proposes a new model version (e.g. `v1` to `v2`) with adjusted feature weights. The proposed weights are written to the `bayesian_model_updates` table and queued for admin approval. Once approved via the Admin UI, the new weights are marked as `APPROVED` and are loaded dynamically by the `scoring_engine.py` using `get_latest_weights(regime)`.

## 24. Sector Rotation Engine

### 24.1 Relative Strength (RS) Scoring
The Sector Rotation Engine (`sector_rotation.py`) computes the relative strength of sectors against the Nifty 50 benchmark (`^NSEI`). The sector returns are measured over a 20-day lookback window (`RS_LOOKBACK_DAYS`), and the momentum is measured over a 5-day window (`MOMENTUM_LOOKBACK_DAYS`).

### 24.2 Sector Classifications & Multi-Mapping
Sectors are classified into four quadrants:
- **LEADING:** RS >= 1.0 and RS momentum >= 0 (Strong & Strengthening)
- **IMPROVING:** RS < 1.0 and RS momentum >= 0 (Weak but Recovering)
- **WEAKENING:** RS >= 1.0 and RS momentum < 0 (Strong but Fading)
- **LAGGING:** RS < 1.0 and RS momentum < 0 (Weak & Weakening)

The engine fetches ETF close prices in a single batch query to minimize network queries. Sector names returned by TradingView are translated to ETF tracker equivalents via `TV_SECTOR_TO_ROTATION`.

### 24.3 Zero-Cost Scoring Bonuses
Instead of loading sector data per stock inside the scanning loop, the rotation engine is run once at scanner boot to build a sector-to-RS map. Downstream, each stock retrieves its sector status instantly from memory. The score is modified according to the sector's classification:
- **LEADING:** +4 points
- **IMPROVING:** +2 points
- **WEAKENING:** -2 points
- **LAGGING:** -4 points

## 25. Technical Indicators Engine

### 25.1 Pivot Swing Point Detection
Rather than using simple rolling min/max windows (which capture extreme points regardless of their technical significance), `technical_indicators.py` uses proper pivot swing point detection. It requires a bar's High/Low to be the extreme value in a left-right window (`pivot_n`) of:
- EOD (`1d`): 5 bars
- Hourly (`1h`): 4 bars
- Intraday (`15m`): 3 bars

### 25.2 Timeframe-Aware Support/Resistance Anchoring
For intraday timeframes (15m/1h), pivot points (PP, S1-S3, R1-R3) are calculated from the previous day's OHLC data (using daily charts) instead of the previous intraday bar. This ensures supports and resistances represent standard floor pivots used by institutional traders.

### 25.3 Advanced Metrics: OBV_TREND, BASE_WIDTH, VCP_TIGHTENING
- **OBV_TREND:** Spanning a 50-bar rolling On-Balance Volume. A positive slope awards +1, indicating volume confirms price direction; a negative slope indicates distribution/divergence (-1).
- **BASE_WIDTH:** Measures price consolidation tightness. Calculated as `(rolling_max_high_10 - rolling_min_low_10) / ATR`. Values `< 1.5` represent a tight base (consolidation breakout, +4 points), whereas values `> 3.0` represent volatile price action (-4 points).
- **VCP_TIGHTENING:** True VCP is confirmed if the 20-day average ATR% is strictly lower than the 60-day average ATR%, indicating volatility contraction.

## 26. Observability & System Logging

### 26.1 Database Intercept Handler
The logging framework (`db_logger.py`) installs a custom handler (`DatabaseLogHandler`) to intercept `ERROR` and `CRITICAL` logs. It automatically filters out noisy third-party libraries (e.g. `yfinance`, `urllib3`, `requests`, `httpx`). Valid application error logs are written directly to the `system_logs` table in Postgres, complete with standard traceback formatting.

### 26.2 Unhandled Thread Exceptions
The framework overrides `sys.excepthook` to capture uncaught application or background thread crashes. When triggered, it logs the traceback as a `CRITICAL` error to the database. These logs are exposed via `/api/system_logs` on the Admin dashboard.

## 27. Security & Notification Flow

### 27.1 Web Push Services
The system supports standard Web Push Notifications (`push_service.py`) via the VAPID protocol. Users subscribe through the frontend dashboard, and subscriptions are persisted in the database. When a new alert is generated, `push_service.send_push_to_all()` issues a payload containing the stock symbol and entry price.

### 27.2 Throttling and Eviction
To prevent outage spam (e.g. Fyers token expiration causing background threads to fail and alert the admin every 5 minutes), push notifications are throttled using an in-memory cache for up to 1 hour (`_THROTTLE_SECONDS = 3600`). If a subscriber endpoint returns a `404` or `410` (unregistered/expired), the subscription is automatically evicted from the Postgres database.

## 28. Production Stability & Performance Fixes (July 2026 Audit)

### 28.1 Database Connection Pool Leak Prevention
In `database.py:get_connection()`, a connection checkout operational exception triggered `p.putconn(conn, close=True)` inside `except` blocks but left the local variable `conn` truthy. The subsequent `finally` block executed `p.putconn(conn)` on the same closed/invalid connection, triggering a `PoolError` and corrupting the threaded connection pool's allocation tracking. The fix sets `conn = None` immediately after the first checkout release in the error handlers.

### 28.2 N+1 Query Elimination in Background Pledge Worker
The `pledge_worker.py` daemon was executing an EMR/scanned symbol loop on every iteration (1,100+ tickers), querying the database one-by-one to evaluate cache expiration. This created heavy connection contention and CPU utilization. It has been optimized to a single batch lookup using `symbol = ANY(%s)` in a single database round-trip.

### 28.3 Infinite Watchdog Revival Loop
When environments lacked `SCRAPERAPI_KEY`, the pledge worker thread logged the error and exited. However, the watchdog script `main.py` revived any crashed thread registered in the restartable mappings, leading to a CPU-intensive infinite crash-and-restart loop every 10 seconds. The daemon was modified to pause/sleep and report a descriptive health error state instead of exiting when keys are missing.

### 28.4 RangeIndex Date Coercion & VWAP Calculation Failures
- **Nifty Drop Checks**: `pd.to_datetime(df_safe.index)` on default integer RangeIndex coerced indices into `1970-01-01`. This broke Nifty intraday return checks, rendering the Nifty macro regime gate inside `live_scanner.py` permanently inactive.
- **Intraday VWAP resets**: The VWAP reset logic checked `hasattr(df.index, 'date')` to determine boundary crossings. On integer RangeIndex dataframes, this returned `False` and forced all calculations to fallback to cumulative EOD VWAP.
- **The Fix**: Both subsystems now dynamically search for datetime-like columns (`Datetime`, `Date`, or `index`), set them as index bounds first, and perform datetime conversions on the localized index.

### 28.5 Import Crashes and Timezone Checks
- **Wealth Watchlist Trigger**: If the watchlist was missing, `wealth_engine.py` imported `build_watchlist` from `daily_builder.py`, which failed since the module's entry point is named `main`. Resolved by aliasing the import correctly.
- **Timezone conversions**: Timezone checking inside `multibagger.py` checked `hasattr(df.index, 'tzinfo')`, which is absent on pandas indices. Refactored to inspect `isinstance(df.index, pd.DatetimeIndex)` and `df.index.tz` directly.

### 28.6 Performance Tracker DatetimeIndex bugs
- **RCA**: The performance tracker's method `_fetch_post_alert_bars` accessed `idx.tzinfo` on the dataframe's index to check for timezone status. In pandas, a `DatetimeIndex` does not possess a `.tzinfo` attribute (only `.tz`), raising an `AttributeError` which was caught by a generic handler, silently returning `None` and disabling outcome tracking. Furthermore, if a dataframe with a `DatetimeIndex` already set was passed as `prefetched_hist`, the column lookup discarded it.
- **The Fix**: The check was changed to `idx.tz is None`. Added a type validation check `isinstance(hist.index, pd.DatetimeIndex)` as a fallback so pre-indexed datasets are preserved instead of discarded.

### 28.7 PostgreSQL Status CHECK Constraint Violation
- **RCA**: The `alerts` table has a CHECK constraint `chk_alerts_status` enforcing `status IN ('OPEN', 'WIN', 'LOSS', 'CLOSED')`. When the performance tracker updated trades during partial limit hits (`update_partial_exit`), it tried to write `'PARTIAL_WIN_1'` or `'PARTIAL_WIN_2'`. This violated the check constraint, triggering a `CheckViolation` database error and aborting state transitions.
- **The Fix**: The PostgreSQL initialization schema inside `database.py` was updated to explicitly allow all valid runtime status tags: `'OPEN'`, `'PARTIAL_WIN_1'`, `'PARTIAL_WIN_2'`, `'WIN'`, `'LOSS'`, `'CLOSED'`, and `'NEUTRAL'`.

### 28.8 Database-Backed CMP Persistence for Breakout Alerts
- **RCA**: When the market was closed or a live price fetch failed, the performance tracker had no way of retrieving the last known current market price (CMP) since the `alerts` table had no `current_price` column. It defaulted `t["current_price"]` to `None`, which overwrote previously saved prices in the dashboard's `performance_data.json` payload, rendering open trade returns as `--`.
- **The Fix**: Addressed this by implementing the exact same database-backed CMP persistence pattern already standard in the Wealth System. Added a `current_price REAL` column to the `alerts` table, initialized it to `entry_price` on creation, and update it dynamically whenever fresh prices are successfully fetched. Off-market, the tracker loads and preserves the database-cached value.

### 28.9 Misleading Entry Price Displayed as CMP + trigger_performance_rebuild Not Fetching Live Prices
- **RCA (Misleading fallback)**: During the initial implementation of the `current_price` column, a fallback `else entry_price` was added when the DB column was `NULL`. This caused all existing (pre-migration) alerts and today's alerts (created before deployment) to show `CMP = entry_price` and `P&L = +0.00%`, which is misleading — it implies no price movement when in fact the live price was simply not yet recorded.
- **Fix**: Removed the fallback. When `current_price` is `NULL` in the DB, it renders as `--` on the dashboard, which is honest and correct.
- **RCA (No live fetch in auto-triggers)**: `trigger_performance_rebuild()` was calling `build_performance_data()` without `force_live_fetch=True`. This meant all accept/reject/refresh-triggered rebuilds skipped live price fetching and never saved fresh CMP to the database, even when admin manually triggered them.
- **Fix**: Changed `trigger_performance_rebuild()` to always call `build_performance_data(force_live_fetch=True)`. This ensures every rebuild (auto or manual) fetches the latest price from Fyers/Yahoo and persists it to the `current_price` column in the `alerts` table. Bar history SL/target checks are also correctly triggered off-market, catching any missed SL/target hits from the trading day.

### 28.10 Duplicate SL_HIT & The Full Replay Architecture

**Severity: Critical — produced contradictory exit history and incorrect final P&L**

#### Root Cause (Incremental Processing Failure)

Previously, the `process_trade_history` state machine was incremental. When a trade hit `PARTIAL_WIN_2` (T1 and T2 hit, SL raised to T1 level), a subsequent run might re-apply that *raised* SL retroactively to ALL historical bars — including bars that occurred BEFORE T1/T2 were even hit. This caused false, retroactive Stop Loss events. A temporary fix attempted to skip bars before the `last_event_ts`, but this was brittle and prone to DB persistence failures.

#### The Fix: Full Replay Architecture

We completely overhauled the engine to use a robust **Full Replay** methodology, decoupling the persistent database state from the in-memory chronological state machine.

**1. Clean State Initialization:**
Whenever the tracker processes a trade, it forces the in-memory state back to `OPEN`, resets `remaining_shares`, and sets the `stop_loss` back to the original `initial_stop_loss`.

**2. Chronological Forward Iteration:**
It fetches *all* 5-minute bars strictly starting from the `alert_time` to the present moment, walking forward chronologically.

**3. State Evolution & DB Deduplication:**
As it walks forward:
- If a target is hit (e.g., T1), it naturally raises the in-memory trailing SL for the *next* bars.
- To prevent writing duplicate exit events to the database (and double-booking P&L), it checks the DB's `exit_history`. If `"T1_HIT"` is already in the database, it skips the DB write, but *still raises the in-memory SL* so the replay continues accurately.
- This guarantees the exact sequence of events is always preserved perfectly, regardless of tracking interruptions.

#### Admin Recalculation (Manual Fix Tool)
To allow administrators to back-test, audit, or fix corrupted closed trades, we introduced a manual override.
- An endpoint `/api/alert/recalculate` and a button on the dashboard allow an admin to force-reset any closed position.
- This triggers `reset_alert_for_recalculation()` in the database, which physically deletes the trade's old `exit_history`, sets its status back to `OPEN`, and resets its SL.
- It then instantly commands the performance tracker to rebuild the entire exit history from scratch using the Full Replay engine.

## 19. SL_ENGINE_V7: The Multi-Target Architecture (Active Legacy Fallback)

**Status: Production-Grade V1.5 Architecture (Operating in `v1.0` Fallback Mode)**

To support massive scaling across dozens of scanners and to ensure determinism in position sizing, we overhauled the core pipeline. The most critical shift is that **the database is no longer used as a message queue**. Instead, candidates flow through an abstract in-memory interface, allowing the database to act purely as the source of truth for the *final state*. 

> [!WARNING]
> **Orphaned V2.0 Institutional Engine**: The codebase contains a highly advanced Object-Oriented "V2.0 Institutional Engine" (with Kelly fractions, Bayesian confidence scoring, and dynamic Volatility Regimes). However, none of the scanners currently invoke it. `compute_sl_and_target()` defaults to `engine_version="v1.0"`, forcing all scanners into the `_legacy_compute_sl_and_target()` function which executes the **SL_ENGINE_V7** described below.

### 19.1 The V7 Target Engine (Dynamic Profit Taking & Structural Cascades)
The SL_ENGINE no longer outputs a single `target_price`. It now outputs a three-stage cascade (`target_1`, `target_2`, `target_3`), mathematically anchored to structural resistance and capped by macro volatility.

- **Dynamic Support Selection Cascade (Stop-Loss Anchoring):**
  Searches below entry price for the strongest structural support using priority cascade:
  1. `swing_low_cluster` (Average of 2+ swing lows clustered within 1%)
  2. `swing_low` (True technical pivot low)
  3. `s1` (Standard floor pivot)
  4. `swing_low_raw` (Rolling window low fallback)
  5. `s2` (Deeper floor pivot)

- **Dynamic Resistance Selection Cascade (Target Anchoring):**
  Anchors T1 to the nearest logical structural resistance above entry price:
  1. `swing_high` (True technical pivot high)
  2. `r1` (Standard ceiling pivot)
  3. `bb_upper` (Volatility ceiling limit)
  4. `swing_high_raw` (Rolling window high)
  5. `r2` (Deeper ceiling pivot)

- **Multi-Target Scaling:** 
  - **T1 (Primary):** Anchored to nearest structural resistance via the cascade above.
  - **T2 (Secondary):** 1.5x Risk/ATR projection, capped by regime constraints.
  - **T3 (Runner):** 3.0x Risk/ATR projection, capped by regime constraints.

- **Target Kill-Gates (NO_VALID_STRUCTURAL):** 
  - If no valid structural support can be found below entry, the trade is rejected with `NO_VALID_STRUCTURAL_STOP`.
  - If the natural RR to the nearest resistance is below the scanner's minimum threshold (e.g. 2.0x for EOD/Reversal), the trade is rejected with `NO_VALID_STRUCTURAL_TARGET`.

#### Target Suppression (The "Missing T2/T3" Logic)
The engine proactively suppresses secondary targets based on mathematically proven momentum exhaustion. When a target is suppressed, it is saved as `null` in the DB.
1. **Missing T2:** If the stock is currently **Overbought** (RSI > 72), momentum is considered exhausted. `target_2` is forced to `null`, meaning the tracker will exit 100% of shares safely at T1.
2. **Missing T3:** The runner target requires elite institutional momentum. If `MACD < 0`, or RSI is overbought, or `ADX < 25`, the `target_3` is forced to `null`. 
3. **Reversals:** Mean-reversion trades are highly speculative. The reversal scanner hardcodes `target_3` to `null` so it never chases runners on failing stocks.

### 19.2 The Hierarchical Separation of Concerns
The pipeline is designed to be the universal standard for all strategies. **Currently, this full pipeline is ONLY implemented for the `MULTI_TF` scanner.** The `EOD` and `Reversal` scanners utilize the V7 Target Engine, but they bypass the Opportunity Manager and write directly to the database (legacy execution).

Future roadmaps will unify all scanners to use this exact flow:
```mermaid
graph TD
    A[Scanner Script] -->|Emits Candidates| B(CandidatePool Interface)
    B --> C{OpportunityManager}
    C -->|Batch Ranking| D[TradeRankingEngine]
    D -->|Ranked Trades| E[PortfolioEngine]
    E -->|Funded / Rejected| F[(PostgreSQL Alerts Table)]
```

### 19.3 The Opportunity Manager & Portfolio Engine

#### 1. CandidatePoolService (The Abstract Buffer)
- **V1.5 Implementation:** `InMemoryCandidatePool`. Scanners push candidates into this memory pool during their active run.
- **Why?** It abstracts the storage. Tomorrow, this can be swapped with Redis, Kafka, or RabbitMQ without touching a single line of scanner logic.
- **Rule:** Never use SQL `INSERT -> SELECT -> UPDATE` as a short-lived event bus.

#### 2. TradeRankingEngine (The Deterministic Sorter)
- **Problem:** Weighted composite scores (Technical 40%, Sector 20%) cause "score collisions" where fundamentally different trades look identical.
- **Solution (Hierarchical Sorting):** Trades are sorted strictly by tiers.
  1. Quality Gate (Must pass minimum thresholds)
  2. Institutional Score (Follow the big money)
  3. Technical/Trend Score (Pure momentum)
  4. Reward Quality (Natural R:R Ratio)
  5. **Tie Breaker (Freshness):** Time decay (0-30m) and price drift are used as multipliers to break ties, heavily favoring trades generated closer to the actual breakout threshold.

#### 3. PortfolioEngine (The Capital Allocator)
- Purely responsible for: *"Which of these ranked trades can we actually afford?"*
- Implements institutional risk sizing: allocates a strict percentage of the portfolio's equity to each trade, bounding total exposure based on `max_open_risk` and `max_new_positions`. If out of money, trades are rejected.

#### 4. OpportunityManager (The Orchestrator)
- Pulls from the `CandidatePool`, calls `TradeRankingEngine`, passes the sorted list to `PortfolioEngine`, and coordinates the final write. It natively suppresses duplicate signals by checking `symbol` + `breakout_type` in memory.
- **Crucial Rule (Negative Logging):** We persist NOT ONLY the `FUNDED` trades, but also `REJECTED_CAPITAL` (ran out of money) and `REJECTED_RANK` (poor setups). This prevents survivorship bias in backtesting.

### 19.4 Exit Monitor Integration (Gap Handling & Multi-Targets)
The `performance_tracker.py` is fully decoupled from the Scanners. It processes the V6 multi-targets flawlessly:
- **Massive Gaps:** If a stock gaps UP past all three targets simultaneously, the state machine cascades through `T1_HIT`, `T2_HIT`, and `T3_HIT` on the exact same tick, logging all partial exits at the `open_p`. Gap Downs trigger SL exits instantly at the open.
- **Missing Targets:** If `t2` or `t3` is `null` in the database, the monitor automatically forces a 100% `rem_shares` exit at the prior target, closing the trade cleanly as a `WIN` without leaving orphaned shares open in the database.

## 29. Lessons Learnt & Future Development Guidelines

### 29.1 The RangeIndex Pitfall in Pandas
- **Rule**: When fetchers or data providers reset dataframe indexes (converting `Date`/`Datetime` to columns), never assume that `df.index` represents a datetime or contains timestamp attributes/methods.
- **Guideline**: Always resolve the index dynamically by looking for date columns: `datetime_col = next((c for c in ["Datetime", "Date", "index"] if c in df.columns), None)`. If found, set it to the index before executing date-based groupbys, resamples, or filters.

### 29.2 Thread Exits vs. Watchdog Lifecycles
- **Rule**: If a daemon thread has a fatal configuration dependency (e.g. missing keys or credentials), it must not simply exit. Exiting triggers self-healing watchdogs to spawn a thread revival loop.
- **Guideline**: Capture initialization errors, report the error description to the central dashboard health database (`upsert_scanner_health`), and put the thread to sleep for long intervals (e.g., 1 hour) instead of exiting the function.

### 29.3 Batch Database Ingestion (Avoiding N+1 Loops)
- **Rule**: Do not query the database within a loop iterating over watchlists or symbol universes.
- **Guideline**: Rely on PostgreSQL array structures (`symbol = ANY(%s)`) or bulk `IN` statements to load all indices or records in a single query, followed by in-memory key indexing.

### 29.4 LRU Cache Invalidation
- **Rule**: If functions accessing database caches are decorated with `@lru_cache`, they will serve stale or missing entries forever if the database updates in the background.
- **Guideline**: Clear the cache using `func.cache_clear()` at the start of any scanner execution cycle to ensure the database updates are correctly registered.

### 29.5 Ghost PNL for Rejected Trades & Frontend Masking
- **Rule**: Never mask or destructively alter core backend status enumerations (`OPEN`, `WIN`, `LOSS`) just to satisfy frontend filtering requirements (like hiding "Rejected" trades).
- **Guideline**: The Performance Tracker requires the true historical state (`WIN` / `LOSS`) of every trade to accurately calculate the PNL of the alerting algorithm, even if the user manually rejected the trade. We enforce this by preserving the true `status` in the database, and using a separate boolean `is_rejected` column. The JSON API layer (`get_all_alerts`) handles the frontend masking on-the-fly by overwriting `status = "REJECTED"` only in the HTTP payload if `is_rejected` is true, keeping the database constraint and performance algorithms mathematically pure.

### 29.6 Dynamic Timeout Threading in Rate-Limited Fetches
- **Rule**: When using `ThreadPoolExecutor.as_completed(timeout=X)`, the timeout must NEVER be a hardcoded static value if the underlying tasks are rate-limited.
- **Guideline**: Rate limiters (e.g., 1.5 requests/sec for Fyers) enforce a mathematical floor on execution time. If you batch fetch 750 symbols at 1.5/sec, it will take at least 500 seconds. A hardcoded 300s timeout will abruptly kill the batch exactly 300 seconds in (after 450 symbols), silently dropping data. Always compute timeouts dynamically based on the input size: `calc_timeout = max(300, len(symbols) * 2)` to guarantee safety buffers.

### 29.7 Dashboard UI Flexbox Layouts vs Rigid Grids
- **Rule**: Avoid rigid CSS Grids for highly dynamic data-dense KPI rows unless strict column wrapping is controlled via media queries.
- **Guideline**: Use CSS Flexbox (`display: flex; flex-wrap: wrap; gap: 1rem`) for `.kpi-row` components. This prevents overlapping numbers and horizontal overflow cropping on mobile or split-screen views, allowing cards to naturally reflow.

### 29.8 Timezone Boundary Leaks in 5m YFinance Pipelines
- **Rule**: If the underlying fetcher drops timezone awareness, 5m intra-day bars will implicitly fallback to UTC, completely misaligning local market trading logic.
- **Guideline**: Implement strict explicit normalization (`normalize_index`) immediately after dataframe initialization. Ensure `df.index` is actively localized to `Asia/Kolkata` before passing to any timeframe bounding logic or indicator applications.

### 29.9 Intraday Candle Alignment & YFinance 15m Overlaps
- **Rule**: Strict bar counts (e.g., expecting exactly three 5m bars inside a 15m block) will fail frequently due to provider anomalies or delayed ticks at the market open (e.g., 9:15).
- **Guideline**: Always relax exact bounds to soft bounds. For instance, `len(seq) < 2` is a safer fallback than `len(seq) != 3`. This accommodates missing provider data while maintaining enough structural integrity to validate the pattern.

### 29.10 Missing Target Handling in State Machines
- **Rule**: When evaluating target progressions (e.g. T1 -> T2 -> T3), do not assume all targets will be populated. Different scanning timeframes (like MF/Multi-Timeframe) intentionally omit T3 to cap exposure.
- **Guideline**: The state machine must elegantly fallback. If `T3` is null or missing when `T2` is hit, the engine must immediately liquidate the entire remaining position (`shares_to_sell = rem_shares`) rather than calculating a percentage exit and leaving stranded shares.

### 29.11 Observability Blindspots in Exception Handlers
- **Rule**: Catching exceptions to prevent crashes is necessary, but using bare `except Exception:` without logging tracebacks causes catastrophic losses of observability.
- **Guideline**: If an exception is expected to happen and shouldn't crash the loop, ALWAYS use `logger.exception(f"Context msg: {e}")`. This ensures custom database logging handlers that rely on `sys.exc_info()` can correctly insert the full traceback into the `system_logs` table for admin debugging.

### 29.12 Graceful Degradation in Date Parsing Fallbacks
- **Rule**: When parsing dynamic database string values (like `alert_date`), failing to parse the date MUST fallback to the safest, most neutral value possible.
- **Guideline**: In the `multibagger` auto-exit monitor, an unparseable date defaulted to `days_held = 999`. This erroneously triggered time-based holding decay exits, ruining the portfolio logic. Always use safe, non-triggering defaults (like `days_held = 0`) when date parsing exceptions occur, and log the failure.

### 29.13 Pandas Timezone Comparison TypeErrors
- **Rule**: You cannot filter a localized timezone-aware pandas index (e.g. `df.index`) using a timezone-naive datetime object (e.g. `block_start`). 
- **Guideline**: Pandas will natively throw a silent `TypeError: Cannot compare tz-naive and tz-aware timestamps`. If the dataframe is localized to `Asia/Kolkata`, explicitly ensure the comparison variable is either localized or converted: `block_start = block_start.tz_localize(IST) if getattr(block_start, 'tzinfo', None) is None else block_start.tz_convert(IST)`.

### 29.14 API JSON Parse Vulnerabilities
- **Rule**: If a frontend-facing health API relies on database values formatted as JSON, it must gracefully catch JSON parse failures.
- **Guideline**: In Railway or similar serverless containers, an uncaught exception in the `/health` check will cause the load balancer to forcefully restart the container. Wrap API JSON loading in `try/except as e:` and use `logger.warning()` rather than `logger.exception()` if it runs frequently, to prevent flooding the database `system_logs` with recurring errors.

## 30. Incident Reports & Root Cause Analyses (RCA)

### 30.1 Admin Dashboard Infinite Loading Freeze (July 2026)
**Incident:** The Admin Dashboard continuously showed the loading overlay and failed to render, while backend server logs showed no crashes. EOD and Reversal scanners were incorrectly reported as not triggering.
**Root Cause:** 
- A closed trade in the database had a missing or zero cost basis, causing the backend performance tracking calculations to yield `NaN` (Not-a-Number) and `Infinity`.
- The `performance_tracker.py` serialized these mathematical anomalies directly into the `performance_data.json` payload. While `math.isnan` was sanitized in an earlier patch, Python's `json.dumps()` still passed `float('inf')` as `Infinity`.
- The browser-side JSON parser threw an uncaught `SyntaxError: Unexpected token I in JSON at position X` because `Infinity` is strictly invalid in JSON.
- Because `await r.json()` was unhandled in the original JS, this caused a silent unhandled promise rejection that permanently froze the UI in a loading state.
**Resolution & Architectural Rule:**
- **Sanitization:** All JSON payloads transmitted to the frontend MUST sanitize ALL float anomalies. `performance_tracker.py` was updated to check both `math.isnan(obj)` and `math.isinf(obj)` and replace them with `0.0` or `null` before serialization. Additionally, a crash in the `_write_empty` fallback function was resolved.
- **Frontend Fault Tolerance:** The frontend API fetch calls in `admin_dashboard.html` were wrapped in `try/catch` blocks using `await r.json()`. If parsing fails, the UI must gracefully degrade to a fallback state (e.g., "No alert history") rather than halting the entire dashboard execution thread.

### 30.2 User and Wealth Dashboard Freeze (Pandas DataFrame JSON Serialization)
**Incident:** The user and wealth dashboards suffered from incomplete or frozen loading states.
**Root Cause:**
- Similar to incident 30.1, the dashboards process large payloads of JSON data parsed natively in the browser via `await r.json()`.
- The APIs returning this data (`/api/wealth`, `/api/shortlist`) utilized Pandas DataFrame's `.to_json(orient="records")` method and passed the output through `json.loads()` and `json.dumps()`.
- Because Pandas converts missing values or anomalies to `NaN` or `Infinity`, and Python's native JSON library accepts these, the server payload was being sent with unquoted `NaN`/`Infinity` literals.
- Browsers throw a strict `SyntaxError` on encountering these literals during JSON parsing, causing the frontend JavaScript loop to permanently crash and leaving the DOM in a perpetually frozen/loading state.
**Resolution & Architectural Rule:**
- **DataFrame Sanitization:** Never rely on native `df.to_json()` when streaming directly to web frontends if the data potentially contains float anomalies (like ratios, P/E, PEG).
- Always convert to a dictionary `df.to_dict(orient="records")` and recursively sanitize all `math.isnan` and `math.isinf` values to `None` BEFORE invoking `jsonify` or `json.dumps()`.

### 30.3 Background Thread Deletion & Schedule Desync
**Incident:** Following a system orchestrator (`main.py`) refactor, essential background threads (like the Daily Builder and Staleness Watchdog) ceased executing on local deployments.
**Root Cause:**
- An automated patch inadvertently deleted the `run_system_scheduler` and `run_performance_tracker` functions from `main.py`, as well as removing them from the `RESTARTABLE_THREADS` orchestration dictionary.
- Schedule labels in `admin_dashboard.html` became desynchronized from the actual `wait_for_window` constraints.
**Resolution & Architectural Rule:**
- The missing blocks were restored by directly extracting them from `main_origin.py`.
- **UI Truth Sync:** The `scheduled_for` database string must perfectly mirror the backend chron constraint. EOD and Reversal schedule strings were corrected to `18:30 IST` and Multibagger to `Daily 19:00 IST` to prevent admin confusion regarding trigger times.
- **Zero-Alert Silence:** Scanners are intentionally designed to succeed silently if 0 alerts are found (without Telegram spam). Admins must verify health via the "Scanners Health" dashboard pane, which necessitates that the dashboard UI remains highly fault-tolerant (see 30.1).

## 31. Scanner Notifications & Admin Push Architecture

The notification system uses `push_service.py` (`send_push_to_all`) to dispatch real-time web push notifications to the Admin Dashboard and subscribed devices.

### 31.1 Notification States per Scanner

To ensure administrators have complete observability without relying solely on Telegram, the system pushes notifications across three critical execution states:

| Scanner | Success (Empty) / 0 Alerts | Success / >0 Alerts | Crash / Degraded |
| :--- | :--- | :--- | :--- |
| **EOD Scanner** | `send_push_to_all` triggered (Empty Watchlist or 0 breakouts). | `send_push_to_all` triggered with total alert count. | `send_push_to_all` on Exception (`DOWN`) or Stale Data (`DEGRADED`). |
| **Reversal Scanner** | `send_push_to_all` triggered (Empty Watchlist or 0 reversals). | `send_push_to_all` triggered with total alert count. | `send_push_to_all` on Exception (`DOWN`) or Stale Data (`DEGRADED`). |
| **Multibagger** | `send_push_to_all` triggered (0 qualified stocks). | `send_push_to_all` triggered with total alert count. | `send_push_to_all` on execution crash (`main.py`) or Incomplete Data (`DEGRADED`). |

### 31.2 Throttle Bypass
For automated background scanner tasks, the `bypass_throttle=True` flag is heavily utilized in `send_push_to_all` to guarantee the delivery of scanner completion states, bypassing the default anti-spam caching limits. This ensures that even if scanners finish closely together, notifications are reliably delivered to the Admin Dashboard.

## 32. Rejected Trades Lifecycle & KPI Integrity

The execution engine maintains rigorous boundaries between active monitoring and manually rejected stocks to prevent false PnL tracking and KPI pollution.

### 32.1 The Rejection State
- When an admin explicitly rejects an alert from the Dashboard (e.g., due to poor Natural RR or structural invalidation), the API updates the trade in the database by setting **`is_rejected = TRUE`** and hardcoding **`status = 'REJECTED'`**.
- Rejected trades are immediately filtered out from the `performance_tracker.py` active tracking loop. This prevents the execution engine from erroneously monitoring the rejected stock's live ticks for Stop Loss or Target breaches.
- Consequently, a rejected stock will **never** mutate into a `WIN` or `LOSS` state, ensuring zero impact on the system's global Win Rate or Average Return KPIs.

### 32.2 KPI Scrubbing (Historical Cleanup)
- In the event of a state misalignment (where a rejected trade incorrectly morphed into a `LOSS`), the `fix_rejected_status.py` cleanup script serves as a hard override. It retroactively scans for trades with `is_rejected = TRUE` and forcibly nullifies false PnL values while locking the state back to `REJECTED`.
