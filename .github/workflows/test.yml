name: Run Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt > pip_error.log 2>&1 || (gh issue create --title "Pip Install Error" --body "$(cat pip_error.log | tail -n 100)" || echo "Issue creation failed"; exit 1)
        pip install pytest pytest-flask pytest-mock pytest-cov
    - name: Test with pytest
      run: |
        python -m pytest tests/
