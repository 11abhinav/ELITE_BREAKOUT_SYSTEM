name: Run Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt > pip_error.log 2>&1 || (
          URL=$(curl -s -F "content=<-" http://dpaste.com/api/v2/ < pip_error.log)
          echo "::error::Pip Install Failed. Log uploaded to: $URL"
          exit 1
        )
        pip install pytest pytest-flask pytest-mock pytest-cov
    - name: Test with pytest
      run: |
        python -m pytest tests/
