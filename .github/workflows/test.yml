name: Run Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt > pip_error.log 2>&1 || (git config user.email "bot@example.com" && git config user.name "bot" && git add pip_error.log && git commit -m "add pip log" && git push && exit 1)
        pip install pytest pytest-flask pytest-mock pytest-cov
    - name: Test with pytest
      run: |
        python -m pytest tests/
