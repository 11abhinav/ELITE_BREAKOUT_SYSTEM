<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Profile - Elite Breakout System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: rgba(255,255,255,.08); --text: #f8fafc;
    --muted: #94a3b8; --accent: #059669; --warn: #e11d48; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
    margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  .container {
    background: var(--surface); padding: 40px; border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,.2);
    width: 100%; max-width: 450px;
  }
  h2 { margin: 0 0 10px; font-weight: 600; font-size: 24px; text-align: center; }
  p.subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .form-row { display: flex; gap: 16px; margin-bottom: 20px; }
  .form-group { flex: 1; }
  .form-group.full { width: 100%; margin-bottom: 20px; flex: none; }
  label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  input {
    width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: inherit; font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; transition: opacity 0.2s;
  }
  button:hover { opacity: 0.9; }
  .error { color: var(--warn); font-size: 14px; margin-bottom: 16px; display: none; text-align: center; }
</style>
<!-- ── PWA: Manifest ── -->
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EliteBreakout">
</head>
<body>
  <div class="container">
    <h2>Complete Setup</h2>
    <p class="subtitle">Please provide your real details and choose a permanent password.</p>
    <div id="error-msg" class="error"></div>
    <form id="profile-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="first_name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="last_name" required>
        </div>
      </div>
      <div class="form-group full">
        <label>Unique Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group full">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group full">
        <label>Mobile Number</label>
        <input type="tel" id="mobile" required>
      </div>
      <div class="form-group full">
        <label>New Permanent Password</label>
        <input type="password" id="new_password" required minlength="8">
      </div>
      <button type="submit">Complete Setup</button>
    </form>
  </div>

<script>
  function getApiBase() {
    return (window.location.protocol === 'file:' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') 
        ? 'https://elitebreakoutsystem-production.up.railway.app' 
        : '';
}

  let csrfToken = '';
  
  async function fetchCsrf() {
      const res = await fetch('/api/csrf_token', { credentials: 'same-origin' });
      const data = await res.json();
      csrfToken = data.csrf_token;
  }
  
  fetchCsrf();
  
  document.getElementById('profile-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Saving...';
    btn.disabled = true;
    
    const formData = new FormData();
    formData.append('first_name', document.getElementById('first_name').value);
    formData.append('last_name', document.getElementById('last_name').value);
    formData.append('username', document.getElementById('username').value);
    formData.append('email', document.getElementById('email').value);
    formData.append('mobile', document.getElementById('mobile').value);
    formData.append('new_password', document.getElementById('new_password').value);
    formData.append('csrf_token', csrfToken);
    
    try {
      const res = await fetch('/complete_profile', {
        method: 'POST',
        body: formData,
        credentials: 'same-origin',
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': csrfToken
        }
      });
      
      if (res.redirected) {
        window.location.href = res.url;
      } else if (!res.ok) {
        const data = await res.json();
        document.getElementById('error-msg').textContent = data.error || 'Failed to update profile';
        document.getElementById('error-msg').style.display = 'block';
        if (res.status === 400 && data.error && data.error.includes("CSRF")) {
            await fetchCsrf(); // Refresh token
        }
      } else {
        // Assume redirect handled by server or manually force reload if somehow JSON returned
        window.location.reload();
      }
    } catch (err) {
      document.getElementById('error-msg').textContent = 'Network error occurred.';
      document.getElementById('error-msg').style.display = 'block';
    } finally {
      btn.textContent = 'Complete Setup';
      btn.disabled = false;
    }
  });
</script>

<script>
  function getApiBase() {
    return (window.location.protocol === 'file:' || window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') 
        ? 'https://elitebreakoutsystem-production.up.railway.app' 
        : '';
}

  // ── PWA: Service Worker Registration ──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
        .then(reg => console.log('[PWA] Service worker registered'))
        .catch(err => console.error('[PWA] SW registration failed:', err));
    });
  }
</script>
</body>
</html>
