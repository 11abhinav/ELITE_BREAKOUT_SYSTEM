<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Elite Breakout System</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090e17; 
    --glass-bg: rgba(13, 17, 28, 0.6); 
    --glass-border: rgba(255,255,255,0.08); 
    --text: #f8fafc;
    --muted: #94a3b8; 
    --accent: #00e5a0; 
    --accent-glow: rgba(0, 229, 160, 0.4);
    --warn: #ff4757; 
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Inter', sans-serif;
    margin: 0; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #090e17 60%);
  }
  
  /* Dynamic Background Effects */
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
    animation: float 10s infinite alternate ease-in-out;
  }
  .orb-1 {
    width: 400px; height: 400px;
    background: rgba(0, 229, 160, 0.15);
    top: -100px; left: -100px;
  }
  .orb-2 {
    width: 300px; height: 300px;
    background: rgba(0, 150, 255, 0.15);
    bottom: -50px; right: -50px;
    animation-delay: -5s;
  }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  .container {
    background: var(--glass-bg); 
    padding: 40px; 
    border-radius: var(--radius);
    border: 1px solid var(--glass-border); 
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.02);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    width: 100%; 
    max-width: 480px;
    z-index: 1;
    position: relative;
    animation: fadeUp 0.6s ease-out;
  }
  
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-container {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo-svg {
    width: 56px;
    height: 56px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px var(--accent-glow));
    animation: pulseGlow 3s infinite alternate;
  }
  @keyframes pulseGlow {
    from { filter: drop-shadow(0 0 12px var(--accent-glow)); }
    to { filter: drop-shadow(0 0 24px rgba(0,229,160,0.8)); }
  }
  
  h2 { 
    margin: 0 0 8px; 
    font-weight: 700; 
    font-size: 24px; 
    text-align: center; 
    font-family: 'Outfit', sans-serif;
    letter-spacing: -0.5px;
    background: linear-gradient(to right, #fff, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 24px;
  }

  .form-row { display: flex; gap: 16px; margin-bottom: 20px; }
  .form-group { flex: 1; position: relative; }
  .form-group.full { width: 100%; margin-bottom: 20px; flex: none; }
  label { 
    display: block; 
    margin-bottom: 8px; 
    font-size: 13px; 
    font-weight: 500;
    color: var(--muted); 
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  input {
    width: 100%; 
    padding: 12px 14px; 
    background: rgba(0,0,0,0.25); 
    border: 1px solid var(--glass-border);
    border-radius: 8px; 
    color: var(--text); 
    font-family: inherit; 
    font-size: 15px; 
    outline: none;
    transition: all 0.3s ease;
  }
  input:focus { 
    border-color: var(--accent); 
    background: rgba(0,0,0,0.4);
    box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.15);
  }
  
  button {
    width: 100%; 
    padding: 14px; 
    background: var(--accent); 
    color: #000; 
    border: none;
    border-radius: 8px; 
    font-weight: 700; 
    font-size: 16px; 
    font-family: 'Outfit', sans-serif;
    cursor: pointer; 
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px var(--accent-glow);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 8px;
  }
  button:hover { 
    transform: translateY(-2px);
    box-shadow: 0 6px 20px var(--accent-glow);
    background: #00faae;
  }
  button:active {
    transform: translateY(1px);
  }
  
  .error { 
    color: var(--warn); 
    font-size: 14px; 
    margin-bottom: 20px; 
    display: none; 
    text-align: center; 
    background: rgba(255, 71, 87, 0.1);
    padding: 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 71, 87, 0.2);
  }
  
  .footer { 
    margin-top: 24px; 
    text-align: center; 
    font-size: 14px; 
    color: var(--muted); 
  }
  .footer a { 
    color: var(--accent); 
    text-decoration: none; 
    font-weight: 600;
    transition: color 0.2s;
  }
  .footer a:hover { 
    color: #fff; 
  }

  /* Chat Widget */
  .chat-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 300px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(20px);
    z-index: 1000;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .chat-header {
    background: rgba(0, 229, 160, 0.1);
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .chat-header:hover {
    background: rgba(0, 229, 160, 0.2);
  }
  .chat-body {
    display: none;
    padding: 16px;
  }
  .chat-body input, .chat-body textarea {
    width: 100%;
    margin-bottom: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px;
    font-family: inherit;
    resize: none;
    font-size: 14px;
    outline: none;
  }
  .chat-body input:focus, .chat-body textarea:focus {
    border-color: var(--accent);
  }
  .chat-body button {
    padding: 10px;
    font-size: 14px;
    margin-top: 0;
  }
</style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <div class="container">
    <div class="logo-container">
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 21H21" stroke="#00e5a0" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 14L8 9L12 13L20 5" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 5H20V9" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 14L8 9L12 13L20 5" stroke="#00e5a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
      </svg>
      <h2>Elite Breakout</h2>
      <div class="subtitle">Join the AI-Powered Network</div>
    </div>

    <div id="error-msg" class="error"></div>
    <form id="signup-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="first_name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="last_name" required>
        </div>
      </div>
      <div class="form-group full">
        <label>Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group full">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group full">
        <label>Mobile Number</label>
        <input type="tel" id="mobile" required>
      </div>
      <div class="form-group full">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Establish Credentials</button>
    </form>
    <div class="footer">
      Already registered? <a href="/login">Authenticate Here</a>
    </div>
  </div>

  <!-- Chat Widget -->
  <div id="chat-widget" class="chat-widget">
    <div class="chat-header" onclick="toggleChat()">
      <span>💬 Contact Admin</span>
      <span id="chat-toggle-icon">▲</span>
    </div>
    <div class="chat-body" id="chat-body">
      <div id="chat-success" style="display:none; color: var(--accent); text-align:center; padding: 20px;">Message sent successfully!</div>
      <form id="chat-form">
        <input type="text" id="chat-name" placeholder="Your Name" required>
        <input type="email" id="chat-email" placeholder="Your Email" required>
        <textarea id="chat-message" placeholder="How can we help you?" required rows="4"></textarea>
        <button type="submit" id="chat-submit">Send Message</button>
      </form>
    </div>
  </div>

<script>
  let csrfToken = '';
  
  async function fetchCsrf() {
      const res = await fetch('/api/csrf_token');
      const data = await res.json();
      csrfToken = data.csrf_token;
  }
  
  fetchCsrf();
  
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Establishing...';
    btn.disabled = true;
    
    const formData = new FormData();
    formData.append('first_name', document.getElementById('first_name').value);
    formData.append('last_name', document.getElementById('last_name').value);
    formData.append('username', document.getElementById('username').value);
    formData.append('email', document.getElementById('email').value);
    formData.append('mobile', document.getElementById('mobile').value);
    formData.append('password', document.getElementById('password').value);
    formData.append('csrf_token', csrfToken);
    
    try {
      const res = await fetch('/signup', {
        method: 'POST',
        body: formData,
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': csrfToken
        }
      });
      
      if (res.redirected) {
        window.location.href = res.url;
      } else if (!res.ok) {
        let data = {};
        try {
            data = await res.json();
        } catch(e) {
            data = { error: res.status === 429 ? 'Too many attempts. Please wait.' : 'Signup failed (' + res.status + ')' };
        }
        
        document.getElementById('error-msg').textContent = data.error || 'Signup failed';
        document.getElementById('error-msg').style.display = 'block';
        if (res.status === 400 && data.error && data.error.includes("CSRF")) {
            await fetchCsrf(); // Refresh token
        }
      } else {
        const data = await res.json();
        document.getElementById('error-msg').style.color = '#059669'; // success color
        document.getElementById('error-msg').style.background = 'rgba(5, 150, 105, 0.1)';
        document.getElementById('error-msg').style.borderColor = 'rgba(5, 150, 105, 0.2)';
        document.getElementById('error-msg').textContent = data.message || 'Account created successfully!';
        document.getElementById('error-msg').style.display = 'block';
        setTimeout(() => window.location.href = '/login', 3000);
      }
    } catch (err) {
      console.error(err);
      document.getElementById('error-msg').textContent = 'Network protocol error. Please try again.';
      document.getElementById('error-msg').style.display = 'block';
    } finally {
      btn.textContent = 'Establish Credentials';
      btn.disabled = false;
    }
  });

  // Chat Widget Logic
  function toggleChat() {
    const body = document.getElementById('chat-body');
    const icon = document.getElementById('chat-toggle-icon');
    if (body.style.display === 'block') {
      body.style.display = 'none';
      icon.textContent = '▲';
    } else {
      body.style.display = 'block';
      icon.textContent = '▼';
    }
  }

  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('chat-submit');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    const formData = new FormData();
    formData.append('name', document.getElementById('chat-name').value);
    formData.append('email', document.getElementById('chat-email').value);
    formData.append('message', document.getElementById('chat-message').value);

    try {
      const res = await fetch('/api/guest_chat', { method: 'POST', body: formData });
      if (res.ok) {
        document.getElementById('chat-form').style.display = 'none';
        document.getElementById('chat-success').style.display = 'block';
        setTimeout(() => {
          toggleChat();
          document.getElementById('chat-form').reset();
          document.getElementById('chat-form').style.display = 'block';
          document.getElementById('chat-success').style.display = 'none';
        }, 3000);
      } else {
        const data = await res.json();
        alert(data.error || 'Failed to send message. Please try again.');
      }
    } catch (err) {
      alert('Network error.');
    } finally {
      btn.textContent = 'Send Message';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
