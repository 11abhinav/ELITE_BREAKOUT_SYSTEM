<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login - Elite Breakout System</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ── PWA: Manifest + Icons ── -->
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-96.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EliteBreakout">
<meta name="theme-color" content="#090e17">
<style>
  :root {
    --bg: #090e17; 
    --glass-bg: rgba(13, 17, 28, 0.7); 
    --glass-border: rgba(255, 255, 255, 0.08); 
    --text: #f8fafc;
    --muted: #94a3b8; 
    --accent: #00e5a0; 
    --accent-glow: rgba(0, 229, 160, 0.5);
    --warn: #ff4757; 
    --radius: 16px;
    --font-heading: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg); 
    color: var(--text); 
    font-family: var(--font-body);
    min-height: 100vh;
    overflow: hidden;
  }
  
  /* Split Layout */
  .split-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }
  
  .visual-panel {
    position: relative;
    background: url('/static/bg_split.png') left center/cover no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
  }
  .visual-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(9,14,23,0.1) 0%, rgba(9,14,23,0.6) 100%);
  }
  .visual-content {
    display: none; /* Text is baked into the background image */
  }

  
  /* Right Panel: Form */
  .form-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: radial-gradient(circle at top right, #1e293b 0%, #090e17 80%);
    position: relative;
  }
  
  /* Glass Form Container */
  .container {
    background: var(--glass-bg); 
    padding: 48px 40px; 
    border-radius: 24px;
    border: 1px solid var(--glass-border); 
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    width: 100%; 
    max-width: 440px;
    position: relative;
    animation: fadeUp 0.8s ease-out;
  }

  /* Micro-Animations */
  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    from { filter: drop-shadow(0 0 12px var(--accent-glow)); }
    to { filter: drop-shadow(0 0 24px rgba(0,229,160,0.8)); }
  }
  
  /* Staggered Form Elements */
  .stagger-1 { animation: fadeUp 0.6s 0.1s both; }
  .stagger-2 { animation: fadeUp 0.6s 0.2s both; }
  .stagger-3 { animation: fadeUp 0.6s 0.3s both; }
  .stagger-4 { animation: fadeUp 0.6s 0.4s both; }

  .logo-container { text-align: center; margin-bottom: 40px; }
  .logo-svg {
    width: 64px; height: 64px; margin-bottom: 16px;
    filter: drop-shadow(0 0 12px var(--accent-glow));
    animation: pulseGlow 3s infinite alternate;
  }
  h2 { 
    font-family: var(--font-heading);
    font-weight: 700; font-size: 28px; 
    margin: 0 0 8px; color: #fff;
  }
  .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 32px; }

  /* Floating Labels */
  .form-group { position: relative; margin-bottom: 24px; }
  .form-group input {
    width: 100%;
    padding: 24px 16px 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
  }
  .form-group label {
    position: absolute;
    top: 18px;
    left: 16px;
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
    transition: 0.2s ease all;
  }
  .form-group input:focus, .form-group input:valid {
    border-color: var(--accent);
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 0 4px rgba(0, 229, 160, 0.1);
  }
  .form-group input:focus ~ label, .form-group input:valid ~ label {
    top: 8px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Button */
  button[type="submit"] {
    width: 100%;
    padding: 16px;
    background: linear-gradient(90deg, var(--accent) 0%, #00faae 100%);
    color: #000;
    border: none;
    border-radius: 12px;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 24px var(--accent-glow);
    margin-top: 8px;
  }
  button[type="submit"]:hover { 
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0, 229, 160, 0.6);
  }
  button[type="submit"]:active { transform: translateY(1px); }

  .error { 
    color: var(--warn); font-size: 14px; 
    margin-bottom: 20px; display: none; text-align: center; 
    background: rgba(255, 71, 87, 0.1); padding: 12px;
    border-radius: 8px; border: 1px solid rgba(255, 71, 87, 0.2);
  }
  
  .footer { margin-top: 32px; text-align: center; font-size: 14px; color: var(--muted); }
  .footer a { color: var(--accent); text-decoration: none; font-weight: 600; transition: color 0.2s; }
  .footer a:hover { color: #fff; text-shadow: 0 0 8px var(--accent-glow); }

  /* Selection Color */
  ::selection { background: var(--accent); color: #000; }
  /* Support Modal */
  .support-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999;
    display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px);
  }
  .support-modal {
    background: var(--glass-bg); padding: 40px; border-radius: 24px;
    border: 1px solid var(--glass-border); width: 100%; max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative;
    animation: fadeUp 0.3s ease-out;
  }
  .support-modal h3 { font-family: var(--font-heading); margin: 0 0 16px 0; font-size: 20px; }
  .close-modal {
    position: absolute; top: 20px; right: 20px; cursor: pointer;
    font-size: 24px; color: var(--muted); line-height: 1; transition: color 0.2s;
  }
  .close-modal:hover { color: #fff; }
  .support-modal input, .support-modal textarea {
    width: 100%; margin-bottom: 16px; background: rgba(0,0,0,0.4);
    border: 1px solid var(--glass-border); border-radius: 12px;
    color: var(--text); padding: 16px; font-family: var(--font-body);
    font-size: 14px; outline: none; transition: border 0.3s;
  }
  .support-modal textarea { resize: none; }
  .support-modal input:focus, .support-modal textarea:focus { border-color: var(--accent); }
  .support-modal button {
    width: 100%; padding: 16px; font-family: var(--font-heading); text-transform: uppercase;
    font-weight: 700; background: var(--accent); color: #000;
    border: none; border-radius: 12px; cursor: pointer; transition: 0.2s;
  }
  .support-modal button:hover { background: #00faae; box-shadow: 0 4px 12px var(--accent-glow); }

  /* Responsive */
  @media(max-width: 900px) {
    .split-layout { grid-template-columns: 1fr; }
    .visual-panel { display: none; }
    body { overflow: auto; }
    .form-panel { padding: 20px; }
  }

  @media(max-width: 480px) {
    .support-modal { padding: 32px 20px; width: calc(100vw - 40px); }
    .container { padding: 32px 20px; }
    .form-panel { padding: 12px; }
  }
</style>
</head>
<body>

<div class="split-layout">
  <!-- Left Side: Visuals -->
  <div class="visual-panel">
    <div class="visual-overlay"></div>
  </div>

  <!-- Right Side: Form -->
  <div class="form-panel">
    <div class="container">
      <div class="logo-container stagger-1">
        <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:40px; height:40px; margin-bottom:8px;">
          <path d="M3 21H21" stroke="#00e5a0" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 14L8 9L12 13L20 5" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 5H20V9" stroke="#00e5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 24px;">Elite Breakout System</div>
        <h2>Sign In to Your Account</h2>
      </div>

      <div id="error-msg" class="error stagger-1"></div>
      
      <form id="login-form">
        <div class="form-group stagger-2">
          <input type="text" id="username" required>
          <label>Username</label>
        </div>
        <div class="form-group stagger-3">
          <input type="password" id="password" required>
          <label>Password</label>
        </div>
        <div class="stagger-4" style="text-align: right; margin-bottom: 16px;">
          <a href="#" style="color: var(--muted); font-size: 13px; text-decoration: none;">Forgot Password?</a>
        </div>
        <div class="stagger-4">
          <button type="submit">Authenticate</button>
        </div>
      </form>
      
      <div class="footer stagger-4">
        <div style="margin-bottom: 16px; position: relative; text-align: center;">
          <span style="background: var(--glass-bg); padding: 0 10px; position: relative; z-index: 1;">Or sign in with SSO</span>
          <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.1); z-index: 0;"></div>
        </div>
        Need an account? <a href="/signup">Sign Up</a><br><br>
        <a href="#" onclick="openSupportModal(); return false;" style="font-weight: 500; font-size: 13px;">Need help? Contact Support</a>
      </div>
    </div>
  </div>
</div>

<!-- Support Modal -->
<div id="support-modal-overlay" class="support-modal-overlay">
  <div class="support-modal">
    <span class="close-modal" onclick="closeSupportModal()">&times;</span>
    <h3>Contact Support</h3>
    <div id="chat-success" style="display:none; color: var(--accent); text-align:center; padding: 10px 0 20px 0; font-weight:600;">Message sent successfully!</div>
    <form id="chat-form">
      <input type="text" id="chat-name" placeholder="Your Name" required>
      <input type="email" id="chat-email" placeholder="Your Email" required>
      <textarea id="chat-message" placeholder="How can we help you?" required rows="4"></textarea>
      <button type="submit" id="chat-submit">Send Message</button>
    </form>
  </div>
</div>

<script>
  let csrfToken = '';
  async function fetchCsrf() {
      const res = await fetch('/api/csrf_token');
      const data = await res.json();
      csrfToken = data.csrf_token;
  }
  fetchCsrf();
  
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Authenticating...';
    btn.disabled = true;
    
    const formData = new FormData();
    formData.append('username', document.getElementById('username').value);
    formData.append('password', document.getElementById('password').value);
    formData.append('csrf_token', csrfToken);
    
    try {
      const res = await fetch('/login', {
        method: 'POST',
        body: formData,
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'X-CSRFToken': csrfToken
        }
      });
      
      if (res.redirected) {
        window.location.href = res.url;
      } else if (!res.ok) {
        let data = {};
        try {
            data = await res.json();
        } catch(e) {
            data = { error: res.status === 429 ? 'Too many attempts. Please wait.' : 'Login failed (' + res.status + ')' };
        }
        
        document.getElementById('error-msg').textContent = data.error || 'Login failed';
        document.getElementById('error-msg').style.display = 'block';
        if (res.status === 400 && data.error && data.error.includes("CSRF")) {
            await fetchCsrf();
        }
      } else {
        const data = await res.json();
        if (data.redirect) {
            window.location.href = data.redirect;
        } else {
            window.location.href = '/';
        }
      }
    } catch (err) {
      document.getElementById('error-msg').textContent = 'Network protocol error. Please try again.';
      document.getElementById('error-msg').style.display = 'block';
    } finally {
      btn.textContent = 'Authenticate';
      btn.disabled = false;
    }
  });

  function openSupportModal() {
    document.getElementById('support-modal-overlay').style.display = 'flex';
  }

  function closeSupportModal() {
    document.getElementById('support-modal-overlay').style.display = 'none';
  }

  // Close modal when clicking outside of it
  document.getElementById('support-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) {
      closeSupportModal();
    }
  });

  document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('chat-submit');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    const formData = new FormData();
    formData.append('name', document.getElementById('chat-name').value);
    formData.append('email', document.getElementById('chat-email').value);
    formData.append('message', document.getElementById('chat-message').value);

    try {
      const res = await fetch('/api/guest_chat', { method: 'POST', body: formData });
      if (res.ok) {
        document.getElementById('chat-form').style.display = 'none';
        document.getElementById('chat-success').style.display = 'block';
        setTimeout(() => {
          closeSupportModal();
          document.getElementById('chat-form').reset();
          document.getElementById('chat-form').style.display = 'block';
          document.getElementById('chat-success').style.display = 'none';
        }, 3000);
      } else {
        const data = await res.json();
        alert(data.error || 'Failed to send message. Please try again.');
      }
    } catch (err) {
      alert('Network error.');
    } finally {
      btn.textContent = 'Send Message';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
