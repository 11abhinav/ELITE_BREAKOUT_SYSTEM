version: "2.0"

# Component Weights by Market Regime
market_regimes:
  BULL:
    business_quality: 25
    financial_quality: 10
    valuation: 20
    trend: 25
    improvement: 20
  NEUTRAL:
    business_quality: 30
    financial_quality: 15
    valuation: 25
    trend: 15
    improvement: 15
  BEAR:
    business_quality: 35
    financial_quality: 25
    valuation: 30
    trend: 0
    improvement: 10

# Stage 1: Kill Gates (Hard Rejections)
kill_gates:
  max_debt_equity: 3.0
  max_profit_decline_yoy: -0.30
  min_roe: 0.05
  min_roce: 0.05

# Stage 2: Quality Minimums (Hard Rejections)
quality_minimums:
  min_business_quality_score: 5.0
  min_financial_quality_score: 5.0

# Stage 3: Valuation Guard (Wait instead of Buy)
valuation_guard:
  enabled: true
  min_relative_score: 5.0
  max_peg: 2.5

# Buy Zone Multipliers
buy_zone:
  atr_multiplier: 1.5
  breakout_buffer: 0.02
  ema50_limit: 0.10

# Sector/Industry Valuation Maps (Configurable Models)
# These define which metrics are scored and their relative weights (sum to 1.0)
industries:
  IT_SERVICES:
    pe: 0.4
    peg: 0.4
    ev_ebitda: 0.2
  IT_PRODUCTS:
    pe: 0.3
    peg: 0.5
    ev_ebitda: 0.2
  PRIVATE_BANK:
    pb: 0.7
    roe: 0.3
  PSU_BANK:
    pb: 0.8
    roe: 0.2
  POWER_GENERATION:
    pb: 0.4
    dividend: 0.2
    ev_ebitda: 0.4
  POWER_TRANSMISSION:
    pb: 0.6
    roe: 0.4
  DEFAULT:
    pe: 0.4
    pb: 0.4
    peg: 0.2
